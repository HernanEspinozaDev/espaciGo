# Publishes only the reviewed migration executable. Never runs it against SQL.
serviceAccount: projects/espacigo-testprod/serviceAccounts/espacigo-cloud-build-deployer@espacigo-testprod.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH
  requestedVerifyOption: VERIFIED
timeout: 1200s
substitutions:
  _COMMIT_SHA: ""
steps:
  - id: build-current-migrator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.runtime-migrator
      - --label=org.opencontainers.image.revision=${_COMMIT_SHA}
      - --tag=southamerica-west1-docker.pkg.dev/espacigo-testprod/espacigo-testprod/espacigo-db-migrator:sha-${_COMMIT_SHA}
      - .
images:
  - southamerica-west1-docker.pkg.dev/espacigo-testprod/espacigo-testprod/espacigo-db-migrator:sha-${_COMMIT_SHA}
