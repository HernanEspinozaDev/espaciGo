# Initial development: the single main trigger owns docs/web/full classification.
# No staging, bastion, SQL passwords in builders or per-instance startup DDL.
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  substitutionOption: MUST_MATCH
serviceAccount: projects/espacigo-testprod/serviceAccounts/espacigo-cloud-build-deployer@espacigo-testprod.iam.gserviceaccount.com
timeout: 7200s
substitutions:
  _DEPLOY_SCOPE: full
steps:
  - id: verify-source-quality
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable@sha256:1855ee6031f03bb7d4b251cfd0e5b88a18fd9a2552a742cf86d269810832c80b
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ "${_DEPLOY_SCOPE}" == full ]]
        quality_python=$$(gcloud info --format='value(basic.python_location)')
        "$$quality_python" scripts/gcp/quality_gate.py --sha="$COMMIT_SHA" --scope="${_DEPLOY_SCOPE}" --wait-seconds=1200
  - id: release-main
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable@sha256:1855ee6031f03bb7d4b251cfd0e5b88a18fd9a2552a742cf86d269810832c80b
    entrypoint: bash
    args:
      - -ceu
      - |
        release_python=$$(gcloud info --format='value(basic.python_location)')
        "$$release_python" scripts/gcp/release_main.py --execute --sha="$COMMIT_SHA" --build-id="$BUILD_ID"
