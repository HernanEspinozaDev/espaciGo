name: Database migration quality

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'db/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.runtime-migrator'
      - 'cloudbuild-migrator-image.yaml'
      - 'db/query/img01_schema_release_evidence.sql'
      - 'scripts/verify_img01_schema_release_evidence.py'
      - 'scripts/test_img01_schema_release_evidence.py'
      - 'scripts/gcp/schema_release_gate.py'
      - 'scripts/gcp/backup_readiness.py'
      - 'scripts/gcp/test_backup_readiness.py'
      - 'cloudbuild.yaml'
      - 'scripts/validate_cloud_build_transition.py'
      - 'scripts/test_cloud_build_quality_gate.py'
      - '.github/workflows/application-quality.yml'
      - '.github/workflows/frontend-quality.yml'
      - 'third_party/pdfcpu/go.mod'
      - 'third_party/pdfcpu/go.sum'
      - 'scripts/test-migration-runner-postgres.sh'
      - 'scripts/test-runtime-migrator-image.sh'
      - 'scripts/gcp/check_migration_ci.py'
      - 'scripts/gcp/test_check_migration_ci.py'
      - 'scripts/gcp/verify_migration_inventory.py'
      - 'scripts/gcp/test_verify_migration_inventory.py'
      - 'scripts/gcp/migration_job_plan.py'
      - 'scripts/gcp/test_migration_job_plan.py'
      - 'scripts/gcp/migration_execution.py'
      - 'scripts/gcp/test_migration_execution.py'
      - 'scripts/gcp/migration_release_manifest.py'
      - 'scripts/gcp/test_migration_release_manifest.py'
      - 'scripts/gcp/quality_gate.py'
      - 'scripts/gcp/test_quality_gate.py'
      - 'scripts/gcp/restore_rehearsal_plan.py'
      - 'scripts/gcp/test_restore_rehearsal_plan.py'
      - '.github/workflows/database-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Test inventory and connection guards
        run: go test ./cmd/dbmigrate ./internal/migrator ./internal/database/cloudsql
      - name: Test mandatory database evidence and inventory verifiers
        run: |
          python3 -m unittest discover -s scripts/gcp -p 'test_check_migration_ci.py' -v
          python3 -m unittest discover -s scripts/gcp -p 'test_verify_migration_inventory.py' -v
          python3 -m unittest discover -s scripts/gcp -p 'test_migration_job_plan.py' -v
          python3 -m unittest discover -s scripts/gcp -p 'test_migration_release_manifest.py' -v
          python3 -m unittest discover -s scripts/gcp -p 'test_migration_execution.py' -v
          python3 -m unittest discover -s scripts/gcp -p 'test_backup_readiness.py' -v
          python3 -m unittest discover -s scripts -p 'test_img01_schema_release_evidence.py' -v
          python3 -m unittest discover -s scripts/gcp -p 'test_quality_gate.py' -v
          python3 -m unittest discover -s scripts/gcp -p 'test_restore_rehearsal_plan.py' -v
      - name: Run mandatory isolated PostgreSQL migrations and failure recovery
        run: bash scripts/test-migration-runner-postgres.sh
      - name: Build and inspect the exact current migrator image locally
        run: bash scripts/test-runtime-migrator-image.sh
