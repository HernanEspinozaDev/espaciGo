name: Application quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build Go packages
        run: go build ./...

  application-images:
    name: application-images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test BuildKit attestation verifier
        run: python3 -m unittest discover -s scripts -p 'test_verify_gcp07_attestations.py'
      # GCP-07D preview/apply policy targeted the retired Actions-to-Terraform
      # rollout. Its tests remain in-tree as historical coverage; the active
      # deployment boundary is checked by validate_cloud_build_transition.py.
      - name: Test retained GCP-08 bootstrap helpers
        run: >-
          python3 -m unittest discover -s scripts -p 'test_gcp08_bootstrap_expiry.py' &&
          python3 -m unittest discover -s scripts -p 'test_gcp08_bootstrap_refresh_diagnostics.py' &&
          python3 -m unittest discover -s scripts -p 'test_gcp08_bootstrap_state_inventory.py' &&
          PYTHONPATH=scripts python3 -m unittest scripts.test_gcp08_legacy_state_reconcile &&
          python3 -m unittest discover -s scripts -p 'test_classify_gcp08_terraform_failure.py'
      - name: Validate Cloud Build application deployment config
        run: python3 scripts/validate_cloud_build_transition.py
      - name: Test IMG-01 schema evidence and versioned release attestation
        run: python3 -m unittest discover -s scripts -p 'test_img01_schema_release_*.py'
      - name: Test schema gate in its pinned Cloud SDK image
        run: bash scripts/test-cloudbuild-schema-sdk.sh
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Test testprod Terraform policy without a backend or credentials
        working-directory: infra/terraform/environments/testprod/gcp
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform test -no-color
      - name: Test GCP-08 temporary bootstrap policy without a backend or credentials
        working-directory: infra/terraform/environments/testprod/gcp08-bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit@sha256:054d632d0d7e94b11cdc6048674773499a5170cf7d8ce0c326daaff6be43c8e0
      - name: Build API OCI image and verify SBOM/provenance without publishing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: api
          platforms: linux/amd64
          push: false
          tags: espacigo-api:ci
          outputs: type=oci,dest=${{ runner.temp }}/espacigo-api.oci.tar
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
            type=provenance,mode=min
      - name: Build Angular SSR OCI image and verify SBOM/provenance without publishing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: espacigo-web:ci
          outputs: type=oci,dest=${{ runner.temp }}/espacigo-web.oci.tar
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
            type=provenance,mode=min
      - name: Verify both OCI attestations without printing their contents
        run: python3 scripts/verify_gcp07_attestations.py "$RUNNER_TEMP/espacigo-api.oci.tar" "$RUNNER_TEMP/espacigo-web.oci.tar"
      - name: Remove temporary OCI images and attestations
        if: always()
        run: rm -f "$RUNNER_TEMP/espacigo-api.oci.tar" "$RUNNER_TEMP/espacigo-web.oci.tar"
