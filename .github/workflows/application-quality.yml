name: Application quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build Go packages
        run: go build ./...

  application-images:
    name: application-images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test BuildKit attestation verifier
        run: python3 -m unittest discover -s scripts -p 'test_verify_gcp07_attestations.py'
      - name: Test GCP-07D environment and Terraform plan policy
        run: python3 -m unittest discover -s scripts -p 'test_gcp07d_policy.py' && python3 -m unittest discover -s scripts -p 'test_gcp08_preview_summary.py'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Test testprod Terraform policy without a backend or credentials
        working-directory: infra/terraform/environments/testprod/gcp
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform test -no-color
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit@sha256:054d632d0d7e94b11cdc6048674773499a5170cf7d8ce0c326daaff6be43c8e0
      - name: Build API OCI image and verify SBOM/provenance without publishing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: api
          platforms: linux/amd64
          push: false
          tags: espacigo-api:ci
          outputs: type=oci,dest=${{ runner.temp }}/espacigo-api.oci.tar
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
            type=provenance,mode=min
      - name: Build Angular SSR OCI image and verify SBOM/provenance without publishing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: espacigo-web:ci
          outputs: type=oci,dest=${{ runner.temp }}/espacigo-web.oci.tar
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
            type=provenance,mode=min
      - name: Verify both OCI attestations without printing their contents
        run: python3 scripts/verify_gcp07_attestations.py "$RUNNER_TEMP/espacigo-api.oci.tar" "$RUNNER_TEMP/espacigo-web.oci.tar"
      - name: Remove temporary OCI images and attestations
        if: always()
        run: rm -f "$RUNNER_TEMP/espacigo-api.oci.tar" "$RUNNER_TEMP/espacigo-web.oci.tar"
