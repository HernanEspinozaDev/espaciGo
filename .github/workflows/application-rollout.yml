name: Application rollout

on:
  workflow_run:
    workflows: [Application release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Preview/apply Cloud Run, or inspect/remove the two approved legacy SQL state bindings
        required: true
        type: choice
        options: [preview, apply, state-inspect, state-remove]
      operation:
        description: Existing image update, initial V67 restore, or legacy SQL state reconciliation
        required: true
        type: choice
        default: update
        options: [update, initial-restore, legacy-state-reconcile]
      release_run_id:
        description: Successful application-release run on main (not used for state reconciliation)
        required: false
        type: string
      preview_run_id:
        description: Required for apply; run that produced the reviewed summary
        required: false
        type: string
      approved_fingerprint:
        description: Required for apply; exact fingerprint from the preview summary
        required: false
        type: string
      confirmation:
        description: Exact confirmation for apply or legacy state removal
        required: false
        type: string
      expected_state_serial:
        description: State serial from a successful state-inspect run; required for state-remove
        required: false
        type: string
      legacy_instance_absence:
        description: Attest that a human-owner SQLAdmin GET returned 404 for the exact legacy instance
        required: true
        type: choice
        default: unverified
        options: [unverified, owner-get-404]

permissions:
  contents: read

concurrency:
  group: testprod-cloud-run-rollout
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_run' || inputs.operation != 'legacy-state-reconcile')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      migration_free: ${{ steps.scope.outputs.migration_free }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        name: Verify existing protected environment without creating it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ github.event_name == 'workflow_run' && 'auto' || (inputs.operation == 'initial-restore' && format('bootstrap-{0}', inputs.mode) || inputs.mode) }}
          PUBLISH_ENABLED: ${{ vars.GCP07C_PUBLISH_ENABLED }}
          ROLLOUT_ENABLED: ${{ vars.GCP07D_ROLLOUT_ENABLED }}
          V67_RUNTIME_PASSWORD_VERSION: ${{ vars.GCP08_V67_DATABASE_PASSWORD_VERSION }}
          V67_RUNTIME_PREFLIGHT_SHA: ${{ vars.GCP08_V67_RUNTIME_PREFLIGHT_SHA }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          FINGERPRINT: ${{ inputs.approved_fingerprint }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/verify_gcp07_environment.py
      - name: Download release manifest for migration scope check
        if: steps.verify.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gcp07d-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          path: preflight-release
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          github-token: ${{ github.token }}
      - id: scope
        name: Require a verified schema baseline with no unapplied migrations
        if: steps.verify.outputs.ready == 'true'
        env:
          SCHEMA_BASELINE_SHA: ${{ vars.GCP07D_SCHEMA_BASELINE_SHA }}
        run: python3 scripts/verify_gcp07_manifest_scope.py preflight-release/manifest.json

  legacy_state_reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.operation == 'legacy-state-reconcile' &&
      (inputs.mode == 'state-inspect' || inputs.mode == 'state-remove') &&
      github.actor_id == '176093371'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testprod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/447373903153/locations/global/workloadIdentityPools/espacigo-gcp08-bootstrap/providers/espacigo-initial-restore
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 363.0.0'
          project_id: espacigo-testprod
      - name: Verify cleanup identity and operator gates
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GCP08_CLEANUP_ENVIRONMENT: testprod
          GCP08_CLEANUP_MODE: ${{ inputs.mode }}
          GCP08_STATE_CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
          GCP08_LEGACY_ABSENCE_ATTESTATION: ${{ inputs.legacy_instance_absence }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from scripts.gcp08_legacy_state_reconcile import CONFIRM_REMOVE, verify_identity, _context_from_env
          if not verify_identity(_context_from_env()):
              raise SystemExit("GCP08_STATE_RECONCILE category=blocked reason=identity_mismatch")
          mode = os.environ.get("GCP08_CLEANUP_MODE")
          if mode not in {"state-inspect", "state-remove"}:
              raise SystemExit("GCP08_STATE_RECONCILE category=blocked reason=mode_mismatch")
          if mode == "state-remove":
              if os.environ.get("GCP08_STATE_CLEANUP_CONFIRMATION") != CONFIRM_REMOVE:
                  raise SystemExit("GCP08_STATE_RECONCILE category=blocked reason=confirmation_mismatch")
              if os.environ.get("GCP08_LEGACY_ABSENCE_ATTESTATION") != "owner-get-404":
                  raise SystemExit("GCP08_STATE_RECONCILE category=blocked reason=owner_get_404_required")
          print("GCP08_STATE_RECONCILE category=identity_verified")
          PY
      - name: Initialize canonical state backend and select default workspace
        env:
          GCP08_PRIVATE_DIR: ${{ runner.temp }}/gcp08-state-reconcile
          TF_DATA_DIR: ${{ runner.temp }}/gcp08-state-reconcile/terraform-data
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$GCP08_PRIVATE_DIR"
          chmod 700 "$GCP08_PRIVATE_DIR"
          cd infra/terraform/environments/testprod/gcp
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=espacigo-testprod-tfstate-447373903153-gcp" \
            -backend-config="prefix=espacigo/testprod/gcp" \
            > "$GCP08_PRIVATE_DIR/init.log" 2>&1 || {
              echo "GCP08_STATE_RECONCILE category=blocked reason=backend_init_failed"; exit 1;
            }
          terraform workspace select default > "$GCP08_PRIVATE_DIR/workspace.log" 2>&1 || {
            echo "GCP08_STATE_RECONCILE category=blocked reason=workspace_select_failed"; exit 1;
          }
      - name: Inspect exact legacy SQL state bindings
        if: inputs.mode == 'state-inspect'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GCP08_CLEANUP_ENVIRONMENT: testprod
          TF_DATA_DIR: ${{ runner.temp }}/gcp08-state-reconcile/terraform-data
        run: |
          set -euo pipefail
          python3 scripts/gcp08_legacy_state_reconcile.py inspect \
            --terraform-dir "$GITHUB_WORKSPACE/infra/terraform/environments/testprod/gcp" \
            --private-dir "$RUNNER_TEMP/gcp08-state-reconcile/inspect"
      - name: Back up and remove only the inspected legacy bindings
        if: inputs.mode == 'state-remove'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GCP08_CLEANUP_ENVIRONMENT: testprod
          GCP08_CLEANUP_MODE: ${{ inputs.mode }}
          GCP08_STATE_CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
          GCP08_LEGACY_ABSENCE_ATTESTATION: ${{ inputs.legacy_instance_absence }}
          EXPECTED_STATE_SERIAL: ${{ inputs.expected_state_serial }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          TF_DATA_DIR: ${{ runner.temp }}/gcp08-state-reconcile/terraform-data
        run: |
          set -euo pipefail
          [[ "$EXPECTED_STATE_SERIAL" =~ ^[0-9]+$ ]] || { echo "GCP08_STATE_RECONCILE category=blocked reason=state_serial_required"; exit 1; }
          python3 scripts/gcp08_legacy_state_reconcile.py remove \
            --terraform-dir "$GITHUB_WORKSPACE/infra/terraform/environments/testprod/gcp" \
            --private-dir "$RUNNER_TEMP/gcp08-state-reconcile/remove" \
            --expected-state-serial "$EXPECTED_STATE_SERIAL" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Remove private Terraform files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/gcp08-state-reconcile"
          rm -f infra/terraform/environments/testprod/gcp/terraform.tfstate \
            infra/terraform/environments/testprod/gcp/terraform.tfstate.backup

  rollout:
    needs: preflight
    if: >-
      needs.preflight.outputs.ready == 'true' &&
      needs.preflight.outputs.migration_free == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.operation != 'legacy-state-reconcile') &&
      (github.event_name != 'workflow_dispatch' || inputs.operation != 'initial-restore' || github.actor_id == '176093371')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: testprod
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download image manifest from selected release run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gcp07d-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          path: release
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source release and digest manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
        run: python3 scripts/verify_gcp07_release_manifest.py release/manifest.json
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Configure private Terraform inputs and image references
        env:
          TFVARS_JSON: ${{ secrets.GCP07D_TFVARS_JSON }}
          MODE: ${{ github.event_name == 'workflow_run' && 'auto' || (inputs.operation == 'initial-restore' && 'bootstrap' || 'update') }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          V67_RUNTIME_PASSWORD_VERSION: ${{ vars.GCP08_V67_DATABASE_PASSWORD_VERSION }}
          V67_RUNTIME_PREFLIGHT_SHA: ${{ vars.GCP08_V67_RUNTIME_PREFLIGHT_SHA }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TFVARS_JSON"
          mkdir -p "$RUNNER_TEMP/gcp07d"
          chmod 700 "$RUNNER_TEMP/gcp07d"
          echo "$TFVARS_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' >/dev/null
          TFVARS_JSON="$TFVARS_JSON" python3 - "$RUNNER_TEMP/gcp07d/terraform.tfvars.json" <<'PY'
          import json,os,re,sys
          p=sys.argv[1]
          with open("release/manifest.json",encoding="utf-8") as f: manifest=json.load(f)
          protected=json.loads(os.environ["TFVARS_JSON"])
          if not isinstance(protected,dict): raise SystemExit("invalid protected configuration")
          if not isinstance(manifest.get("images"),dict): raise SystemExit("invalid release manifest")
          if not re.fullmatch(r"[1-9][0-9]*",os.environ.get("V67_RUNTIME_PASSWORD_VERSION","")):
              raise SystemExit("V67 runtime secret version is not pinned")
          if not re.fullmatch(r"[0-9a-f]{64}",os.environ.get("V67_RUNTIME_PREFLIGHT_SHA","")) or set(os.environ["V67_RUNTIME_PREFLIGHT_SHA"]) == {"0"}:
              raise SystemExit("reviewed V67 runtime preflight reference is missing")
          if protected.get("enable_services") is not True:
              raise SystemExit("protected service configuration is not enabled")
          if os.environ.get("MODE", "").startswith("bootstrap-"):
              if protected.get("enable_foundation") is not True:
                  raise SystemExit("initial restore requires the reviewed foundation configuration")
              if protected.get("enable_mailpit") is not True:
                  raise SystemExit("initial restore must retain the existing Mailpit foundation resources")
              protected["enable_private_services_access"] = True
              if protected.get("confirm_project_inventory") is not True or protected.get("confirm_cost_policy_review") is not True:
                  raise SystemExit("reviewed project inventory and cost/policy confirmations are missing")
              if protected.get("iap_evaluator_members") != ["user:pasteleriahijitos@gmail.com"]:
                  raise SystemExit("Mailpit IAP access must retain its current exact evaluator")
              protected["private_web_iap_evaluator_members"] = ["user:pasteleriahijitos@gmail.com"]
              protected["enable_edge"] = False
              protected["enable_gcp06_jobs_reviewed"] = False
              for key in ("enable_gcp06_admin_bootstrap_job", "enable_gcp06_test_access_job", "enable_gcp06_sql_inspector_job"):
                  protected[key] = False
          if protected.get("confirm_runtime_secret_versions") is not True or protected.get("confirm_runtime_database_bootstrap") is not True:
              raise SystemExit("reviewed V67 runtime verification is missing")
          protected["enable_database"] = False
          protected["api_gcp06_candidate_run_id"] = ""
          protected["api_v67_database_instance_name"] = "espacigo-testprod-db"
          protected["api_v67_database_name"] = "espacigo_dms_stage_20261020"
          protected["api_v67_database_password_version"] = os.environ["V67_RUNTIME_PASSWORD_VERSION"]
          if os.environ.get("MODE") == "bootstrap":
              protected["private_demo_origin_override"] = ""
          if "api" in manifest["images"]: protected["api_image"]=manifest["images"]["api"]
          if "web" in manifest["images"]: protected["frontend_image"]=manifest["images"]["web"]
          with open(p,"w",encoding="utf-8") as f: json.dump(protected,f,sort_keys=True)
          os.chmod(p,0o600)
          image_path=os.path.join(os.environ["RUNNER_TEMP"],"gcp07d","images.json")
          with open(image_path,"w",encoding="utf-8") as f:
              json.dump(manifest["images"],f,sort_keys=True,separators=(",",":"))
          os.chmod(image_path,0o600)
          PY
          echo "GCP07D_TFVARS=$RUNNER_TEMP/gcp07d/terraform.tfvars.json" >> "$GITHUB_ENV"
      - name: Validate protected bootstrap probe targets
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'initial-restore'
        run: python3 "$GITHUB_WORKSPACE/scripts/gcp08_bootstrap_cloud_run_probes.py" --validate-configuration --var-file "$GCP07D_TFVARS"
      - name: Authenticate bootstrap federated identity
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'initial-restore'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/447373903153/locations/global/workloadIdentityPools/espacigo-gcp08-bootstrap/providers/espacigo-initial-restore
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify bootstrap Terraform provider credential source
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'initial-restore'
        run: python3 "$GITHUB_WORKSPACE/scripts/gcp08_bootstrap_cloud_run_probes.py" --check-provider-credentials
      - name: Authenticate restricted application deployer
        if: github.event_name == 'workflow_run' || inputs.operation != 'initial-restore'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/447373903153/locations/global/workloadIdentityPools/espacigo-testprod-github/providers/espacigo-main
          service_account: espacigo-test-deployer@espacigo-testprod.iam.gserviceaccount.com
          token_format: access_token
      - name: Set up Cloud SDK for read-only bootstrap diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'initial-restore'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 363.0.0'
          project_id: espacigo-testprod
      - name: Initialize canonical Terraform root and produce private plan
        env:
          MODE: ${{ github.event_name == 'workflow_run' && 'auto' || inputs.mode }}
          POLICY_MODE: ${{ github.event_name == 'workflow_run' && 'update' || (inputs.operation == 'initial-restore' && 'bootstrap' || 'update') }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          V67_RUNTIME_PASSWORD_VERSION: ${{ vars.GCP08_V67_DATABASE_PASSWORD_VERSION }}
        run: |
          set -euo pipefail
          umask 077
          cd infra/terraform/environments/testprod/gcp
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=espacigo-testprod-tfstate-447373903153-gcp" \
            -backend-config="prefix=espacigo/testprod/gcp" \
            > "$RUNNER_TEMP/gcp07d/init.log" 2>&1 || {
              python3 "$GITHUB_WORKSPACE/scripts/classify_gcp08_terraform_failure.py" --stage init "$RUNNER_TEMP/gcp07d/init.log" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "Terraform initialization failed; raw diagnostics remain private on runner"; exit 1;
            }
          terraform workspace select default > "$RUNNER_TEMP/gcp07d/workspace.log" 2>&1 || {
            python3 "$GITHUB_WORKSPACE/scripts/classify_gcp08_terraform_failure.py" --stage workspace "$RUNNER_TEMP/gcp07d/workspace.log" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Terraform workspace selection failed; raw diagnostics remain private on runner"; exit 1;
          }
          plan_scope=()
          if [[ "$POLICY_MODE" == bootstrap ]]; then
            # Refresh the targeted resources and dependencies, but leave unrelated foundation state out of scope;
            # the validator still requires all three services and exactly the nine bootstrap IAM bindings.
            plan_scope=(
              '-target=google_cloud_run_v2_service.api[0]'
              '-target=google_cloud_run_v2_service.web["public"]'
              '-target=google_cloud_run_v2_service.web["private"]'
              '-target=google_cloud_run_v2_service_iam_member.api_invoker["public"]'
              '-target=google_cloud_run_v2_service_iam_member.api_invoker["private"]'
              '-target=google_cloud_run_v2_service_iam_member.deployer_service_updater["api"]'
              '-target=google_cloud_run_v2_service_iam_member.deployer_service_updater["public"]'
              '-target=google_cloud_run_v2_service_iam_member.deployer_service_updater["private"]'
              '-target=google_cloud_run_v2_service_iam_member.public_web_invoker[0]'
              '-target=google_cloud_run_v2_service_iam_member.private_iap_invoker[0]'
              '-target=google_secret_manager_secret_iam_member.v67_api_secret_access[0]'
              '-target=google_iap_web_cloud_run_service_iam_member.private_evaluators["user:pasteleriahijitos@gmail.com"]'
            )
          fi
          terraform plan -input=false -lock-timeout=5m -var-file="$GCP07D_TFVARS" "${plan_scope[@]}" -out="$RUNNER_TEMP/gcp07d/rollout.tfplan" -no-color > "$RUNNER_TEMP/gcp07d/plan.log" 2>&1 || {
            python3 "$GITHUB_WORKSPACE/scripts/classify_gcp08_terraform_failure.py" --stage plan "$RUNNER_TEMP/gcp07d/plan.log" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$POLICY_MODE" == bootstrap ]]; then
              python3 "$GITHUB_WORKSPACE/scripts/gcp08_bootstrap_state_inventory.py" \
                --terraform-dir "$GITHUB_WORKSPACE/infra/terraform/environments/testprod/gcp" \
                --private-dir "$RUNNER_TEMP/gcp07d/state-inventory" | tee -a "$GITHUB_STEP_SUMMARY"
              python3 "$GITHUB_WORKSPACE/scripts/gcp08_bootstrap_refresh_diagnostics.py" \
                --terraform-dir "$GITHUB_WORKSPACE/infra/terraform/environments/testprod/gcp" \
                --var-file "$GCP07D_TFVARS" \
                --private-dir "$RUNNER_TEMP/gcp07d/refresh-diagnostics" | tee -a "$GITHUB_STEP_SUMMARY"
              python3 "$GITHUB_WORKSPACE/scripts/gcp08_bootstrap_cloud_run_probes.py" \
                --private-dir "$RUNNER_TEMP/gcp07d" --var-file "$GCP07D_TFVARS" | tee -a "$GITHUB_STEP_SUMMARY"
              python3 "$GITHUB_WORKSPACE/scripts/gcp08_bootstrap_target_diagnostics.py" \
                --terraform-dir "$GITHUB_WORKSPACE/infra/terraform/environments/testprod/gcp" \
                --var-file "$GCP07D_TFVARS" \
                --private-dir "$RUNNER_TEMP/gcp07d/target-diagnostics" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            echo "Terraform plan failed; raw diagnostics remain private on runner"; exit 1;
          }
          terraform show -json "$RUNNER_TEMP/gcp07d/rollout.tfplan" > "$RUNNER_TEMP/gcp07d/plan.json" 2> "$RUNNER_TEMP/gcp07d/show.log" || {
            python3 "$GITHUB_WORKSPACE/scripts/classify_gcp08_terraform_failure.py" --stage inspect "$RUNNER_TEMP/gcp07d/show.log" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Terraform plan inspection failed; raw diagnostics remain private on runner"; exit 1;
          }
          python3 "$GITHUB_WORKSPACE/scripts/verify_gcp07_plan.py" "$RUNNER_TEMP/gcp07d/plan.json" \
            --images "$RUNNER_TEMP/gcp07d/images.json" --source-sha "$GCP07D_SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" --mode "$POLICY_MODE" \
            --database-password-version "$V67_RUNTIME_PASSWORD_VERSION" \
            --output "$RUNNER_TEMP/gcp07d/summary.json" > "$RUNNER_TEMP/gcp07d/policy.log" 2>&1 || {
              python3 "$GITHUB_WORKSPACE/scripts/classify_gcp08_terraform_failure.py" --stage policy "$RUNNER_TEMP/gcp07d/policy.log" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "Terraform plan rejected by allowlist guard; raw diagnostics remain private on runner"; exit 1;
            }
      - name: Verify approved preview summary before apply
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gcp07d-preview-${{ inputs.preview_run_id }}
          path: approved-preview
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
      - name: Require exact initial restore preview scope
        if: inputs.mode == 'apply' && inputs.operation == 'initial-restore'
        env:
          EXPECTED_FINGERPRINT: ${{ inputs.approved_fingerprint }}
        run: python3 scripts/verify_gcp08_preview_summary.py approved-preview/summary.json --fingerprint "$EXPECTED_FINGERPRINT"
      - name: Compare fingerprint and apply this job's exact private plan
        if: inputs.mode == 'apply'
        env:
          EXPECTED_FINGERPRINT: ${{ inputs.approved_fingerprint }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          POLICY_MODE: ${{ inputs.operation == 'initial-restore' && 'bootstrap' || 'update' }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$POLICY_MODE" == bootstrap && "$CONFIRMATION" != "APPLY GCP-08 INITIAL RESTORE" ]]; then
            echo "Initial restore confirmation does not match the required phrase" >&2
            exit 1
          fi
          if [[ "$POLICY_MODE" == update && "$CONFIRMATION" != "APPLY GCP-07D" ]]; then
            echo "Image update confirmation does not match the required phrase" >&2
            exit 1
          fi
          python3 scripts/compare_gcp07d_preview.py "$RUNNER_TEMP/gcp07d/summary.json" \
            approved-preview/summary.json "$EXPECTED_FINGERPRINT" "$RELEASE_RUN_ID" "$GCP07D_SOURCE_SHA"
          cd infra/terraform/environments/testprod/gcp
          terraform apply -input=false -auto-approve "$RUNNER_TEMP/gcp07d/rollout.tfplan" > "$RUNNER_TEMP/gcp07d/apply.log" 2>&1 || { echo "Terraform apply failed; private diagnostics retained only on runner"; exit 1; }
      - name: Publish allowlisted preview summary
        if: inputs.mode == 'preview'
        run: |
          mkdir -p gcp07d-preview
          cp "$RUNNER_TEMP/gcp07d/summary.json" gcp07d-preview/summary.json
          python3 -c 'import json; x=json.load(open("gcp07d-preview/summary.json")); print("GCP-07D preview fingerprint: " + x["fingerprint"])' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'preview'
        with:
          name: gcp07d-preview-${{ github.run_id }}
          path: gcp07d-preview/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Apply automatic release plan after activation
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          cd infra/terraform/environments/testprod/gcp
          terraform apply -input=false -auto-approve "$RUNNER_TEMP/gcp07d/rollout.tfplan" > "$RUNNER_TEMP/gcp07d/apply.log" 2>&1 || { echo "Terraform apply failed; private diagnostics retained only on runner"; exit 1; }
          python3 - "$RUNNER_TEMP/gcp07d/summary.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          summary=json.load(open(sys.argv[1],encoding="utf-8"))
          print("GCP-07D automatic rollout completed under the image-only policy." if summary["changes"] else "GCP-07D automatic rollout found no service image changes.")
          print(f"Source SHA: `{summary['source_sha']}`")
          print(f"Release run: `{summary['release_run_id']}`")
          print(f"Policy fingerprint: `{summary['fingerprint']}`")
          PY
      - name: Remove private Terraform files
        if: always()
        run: rm -rf "$RUNNER_TEMP/gcp07d" release approved-preview preflight-release
