version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/query/identity
    gen:
      go:
        package: identitydb
        out: internal/adapters/postgres/identity/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: string
  - engine: postgresql
    schema: db/migrations
    queries: db/query/verification
    gen:
      go:
        package: verificationdb
        out: internal/adapters/postgres/verification/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: string
          - db_type: pg_catalog.bpchar
            go_type: string
