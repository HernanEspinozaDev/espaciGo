name: ${LOCAL_COMPOSE_PROJECT_NAME:-espacigo}

services:
  database:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-database:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: database
    user: "0:0"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_DATABASE_NAME:-espacigo_local}
      POSTGRES_USER: ${LOCAL_DATABASE_ADMIN_USER:-espacigo_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - runtime_password
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-api:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    entrypoint: ["/api", "migrate"]
    user: "${LOCAL_UID:?run scripts/dev-env.sh}:${LOCAL_GID:?run scripts/dev-env.sh}"
    environment:
      LOCAL_AUTH_PROTOTYPE: "1"
      LOCAL_BOOKING_TRIAL: "1"
      DATABASE_HOST: ${LOCAL_DATABASE_HOST:-database}
      DATABASE_PORT: ${LOCAL_DATABASE_PORT:-5432}
      DATABASE_NAME: ${LOCAL_DATABASE_NAME:-espacigo_local}
      DATABASE_USER: ${LOCAL_DATABASE_ADMIN_USER:-espacigo_admin}
      DATABASE_PASSWORD_FILE: /run/secrets/db_admin_password
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DATABASE_SSLROOTCERT: ${DATABASE_SSLROOTCERT:-}
      DATABASE_SSLCERT: ${DATABASE_SSLCERT:-}
      DATABASE_SSLKEY: ${DATABASE_SSLKEY:-}
    secrets:
      - db_admin_password
    volumes:
      - type: bind
        source: ${LOCAL_DATABASE_TLS_DIR:-./.local/database-tls}
        target: /run/database-tls
        read_only: true
    depends_on:
      database:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /data/mailpit.db
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${LOCAL_MAILPIT_PORT:-8025}:8025"
    networks:
      mail:
        aliases: [mailpit]

  backend:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-api:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    user: "${LOCAL_UID:?run scripts/dev-env.sh}:${LOCAL_GID:?run scripts/dev-env.sh}"
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      FRONTEND_PUBLIC_ORIGIN: http://127.0.0.1:${LOCAL_ANGULAR_PORT:-4200}
      LOCAL_AUTH_PROTOTYPE: "1"
      LOCAL_BOOKING_TRIAL: "1"
      LOCAL_BOOKING_QUOTE_TTL: "${LOCAL_BOOKING_QUOTE_TTL:-15m}"
      LOCAL_BOOKING_PAY_TTL: "${LOCAL_BOOKING_PAY_TTL:-15m}"
      LOCAL_BOOKING_HOST_TTL: "${LOCAL_BOOKING_HOST_TTL:-24h}"
      LOCAL_SMTP_ADDR: mailpit:1025
      LOCAL_PAYMENT_WEBHOOK_SECRET_FILE: /run/secrets/local_payment_webhook_secret
      LOCAL_CONTRACT_ENCRYPTION_KEY_FILE: /run/secrets/local_contract_encryption_key
      LOCAL_VERIFICATION_IP_LIMIT: "${LOCAL_VERIFICATION_IP_LIMIT:-20}"
      M03_EVIDENCE_DIR: /var/lib/espacigo/private-evidence
      LOCAL_PRIVACY_REPLAY_FILE: /var/lib/espacigo/privacy-replay/completed-suppressions-v1.json
      DATABASE_HOST: ${LOCAL_DATABASE_HOST:-database}
      DATABASE_PORT: ${LOCAL_DATABASE_PORT:-5432}
      DATABASE_NAME: ${LOCAL_DATABASE_NAME:-espacigo_local}
      DATABASE_USER: espacigo_runtime
      DATABASE_PASSWORD_FILE: /run/secrets/runtime_password
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DATABASE_SSLROOTCERT: ${DATABASE_SSLROOTCERT:-}
      DATABASE_SSLCERT: ${DATABASE_SSLCERT:-}
      DATABASE_SSLKEY: ${DATABASE_SSLKEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:${LOCAL_ANGULAR_PORT:-4200},http://127.0.0.1:${LOCAL_ANGULAR_PORT:-4200},http://angular-frontend:4000
    secrets:
      - runtime_password
      - local_payment_webhook_secret
      - local_contract_encryption_key
    volumes:
      - type: bind
        source: ${LOCAL_M03_EVIDENCE_DIR:?run scripts/dev-env.sh}
        target: /var/lib/espacigo/private-evidence
      - type: bind
        source: ${LOCAL_PRIVACY_REPLAY_DIR:?run scripts/dev-env.sh}
        target: /var/lib/espacigo/privacy-replay
      - type: bind
        source: ${LOCAL_DATABASE_TLS_DIR:-./.local/database-tls}
        target: /run/database-tls
        read_only: true
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-8080}:8080"
    networks:
      - api
      - data
      - mail
    healthcheck:
      test: ["CMD", "/api", "check"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  angular-frontend:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-angular:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      API_INTERNAL_BASE_URL: http://backend:8080/api/v1
      API_PUBLIC_BASE_URL: http://127.0.0.1:${LOCAL_API_PORT:-8080}/api/v1
      FRONTEND_PUBLIC_ORIGIN: http://127.0.0.1:${LOCAL_ANGULAR_PORT:-4200}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_ANGULAR_PORT:-4200}:4000"
    networks:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  netprobe:
    image: espacigo-local-netprobe:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: netprobe
    profiles:
      - verify
    networks:
      - api

networks:
  api:
    driver: bridge
  mail:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: ${LOCAL_PGDATA_VOLUME:-espacigo_pgdata}

secrets:
  db_admin_password:
    file: ${LOCAL_SECRETS_DIR:-./.local/secrets}/db_admin_password
  runtime_password:
    file: ${LOCAL_SECRETS_DIR:-./.local/secrets}/runtime_password
  local_payment_webhook_secret:
    file: ${LOCAL_SECRETS_DIR:-./.local/secrets}/local_payment_webhook_secret
  local_contract_encryption_key:
    file: ${LOCAL_SECRETS_DIR:-./.local/secrets}/local_contract_encryption_key
