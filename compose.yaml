services:
  database:
    image: espacigo-local-database:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: database
    user: "0:0"
    restart: unless-stopped
    environment:
      POSTGRES_DB: espacigo_local
      POSTGRES_USER: espacigo_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - runtime_password
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: espacigo-local-api:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    entrypoint: ["/api", "migrate"]
    user: "${LOCAL_UID:?run scripts/dev-env.sh}:${LOCAL_GID:?run scripts/dev-env.sh}"
    environment:
      LOCAL_AUTH_PROTOTYPE: "1"
      LOCAL_BOOKING_TRIAL: "1"
      DATABASE_HOST: database
      DATABASE_NAME: espacigo_local
      DATABASE_USER: espacigo_admin
      DATABASE_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /data/mailpit.db
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      mail:
        aliases: [mailpit]

  backend:
    image: espacigo-local-api:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    user: "${LOCAL_UID:?run scripts/dev-env.sh}:${LOCAL_GID:?run scripts/dev-env.sh}"
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      LOCAL_AUTH_PROTOTYPE: "1"
      LOCAL_BOOKING_TRIAL: "1"
      LOCAL_BOOKING_QUOTE_TTL: "${LOCAL_BOOKING_QUOTE_TTL:-15m}"
      LOCAL_BOOKING_PAY_TTL: "${LOCAL_BOOKING_PAY_TTL:-15m}"
      LOCAL_BOOKING_HOST_TTL: "${LOCAL_BOOKING_HOST_TTL:-24h}"
      LOCAL_SMTP_ADDR: mailpit:1025
      LOCAL_VERIFICATION_IP_LIMIT: "${LOCAL_VERIFICATION_IP_LIMIT:-20}"
      M03_EVIDENCE_DIR: /var/lib/espacigo/private-evidence
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: espacigo_local
      DATABASE_USER: espacigo_runtime
      DATABASE_PASSWORD_FILE: /run/secrets/runtime_password
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    secrets:
      - runtime_password
    volumes:
      - type: bind
        source: ${LOCAL_M03_EVIDENCE_DIR:?run scripts/dev-env.sh}
        target: /var/lib/espacigo/private-evidence
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - api
      - data
      - mail
    healthcheck:
      test: ["CMD", "/api", "check"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mock-frontend:
    image: espacigo-local-mock:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: mock
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8081"
      API_READY_URL: http://127.0.0.1:8080/health/ready
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - api
    healthcheck:
      test: ["CMD", "/mock", "check"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  netprobe:
    image: espacigo-local-netprobe:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: netprobe
    profiles:
      - verify
    networks:
      - api

networks:
  api:
    driver: bridge
  mail:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:

secrets:
  db_admin_password:
    file: ./.local/secrets/db_admin_password
  runtime_password:
    file: ./.local/secrets/runtime_password
