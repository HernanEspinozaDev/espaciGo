        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '200':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/session:
    get:
      operationId: currentSession
      tags:
      - M01 local
      description: Consulta solo la sesión del Bearer actual y sus roles/estado; no renueva inactividad. No
        acepta IDs de terceros ni parámetros de URL.
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '200':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /spaces/categories:
    get:
      operationId: listSpaceCategories
      tags: [M04 local]
      description: Lista el catálogo versionado de categorías para una sesión válida; no concede permisos comerciales.
      responses:
        '200':
          description: Categorías disponibles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceCategoryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /spaces/categories/{categoryCode}/attributes:
    parameters:
      - name: categoryCode
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSpaceAttributeProfile
      tags: [M04 local]
      description: Entrega el perfil inmutable vigente que describe los campos y validaciones de la categoría.
      responses:
        '200':
          description: Perfil versionado de características.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAttributeProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/categories/{categoryCode}/attributes/{version}:
    parameters:
      - name: categoryCode
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getVersionedSpaceAttributeProfile
      tags: [M04 local]
      description: Devuelve una versión específica e inmutable del perfil, para conservar el contrato de borradores existentes.
      responses:
        '200':
          description: Perfil versionado solicitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAttributeProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces:
    get:
      operationId: listOwnSpaces
      tags: [M04 local]
      description: Lista exclusivamente espacios propios; borradores, publicaciones activas y espacios ocultos permanecen privados fuera de los recorridos autorizados.
      responses:
        '200':
          description: Espacios propios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraftList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createOwnSpaceDraft
      tags: [M04 local]
      description: Crea un borrador privado. El propietario se obtiene de la sesión; no hay publicación, reserva ni cobro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceDraftInput' }
      responses:
        '201':
          description: Borrador creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnSpaceDraft
      tags: [M04 local]
      description: Consulta un espacio propio; un recurso ajeno o inexistente responde 404.
      responses:
        '200':
          description: Espacio propio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOwnSpaceDraft
      tags: [M04 local]
      description: Reemplaza los campos de un borrador propio; no permite cambios de estado comercial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceDraftInput' }
      responses:
        '200':
          description: Borrador actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteOwnPublication
      tags: [M04 local]
      description: >-
        Retira una publicación propia elegible. Revalida reservas no terminales y obligaciones financieras o
        de disputa bajo los bloqueos de propietario/espacio. Si procede, retira contenido del catálogo,
        minimiza el registro técnico y encola los archivos privados para limpieza durable. Conserva
        reservas, ocupaciones, snapshots e historiales; no cancela ni elimina en cascada. Repetir la
        solicitud devuelve el recibo persistido. No implica anonimización.
      responses:
        '200':
          description: Publicación retirada o recibo idempotente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /spaces/{spaceId}/publication:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setOwnSpacePublicationState
      tags: [M04 local]
      description: >-
        Publica u oculta un espacio propio. Requiere rol arrendador; activar exige KYC sintético efectivo
        de la cuenta personal y no concede ni infiere roles. Solo cambia el estado local del espacio, sin
        abrirlo al catálogo general ni alterar reservas existentes. Publicar exige una zona IANA válida; si
        falta, responde `time_zone_required` y conserva el borrador. Un fixture de ensayo habilitado impide
        transiciones hasta que se deshabilite; se responde 409 con código fixture_enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpacePublicationInput' }
      responses:
        '200':
          description: Estado de publicación actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/publication-content:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateOwnPublishedSpaceContent
      tags: [M04 local]
      description: >-
        Modifica título, descripción, capacidad, reglas de uso, ubicación pública y/o precio base de una publicación propia activa u oculta. Requiere titularidad y rol
        arrendador. Un cambio de precio agrega una nueva versión de tarifa y conserva cotizaciones/reservas
        anteriores. La ubicación usa el catálogo SUBDERE_DPA_2018 y no se deriva de dirección o coordenadas.
        No cambia el estado ni la visibilidad del espacio.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishedSpaceContentInput' }
      responses:
        '200':
          description: Datos vigentes de la publicación propia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/gallery:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listOwnSyntheticSpaceGallery
      tags: [M04 local]
      description: Lista la galería propia compuesta en un orden común; fotos reales permanecen privadas hasta la declaración explícita.
      responses:
        '200':
          description: Galería sintética propia y límite vigente.
          content:
            application/json:
              schema:
                type: object
                required: [items, max_photos]
                properties:
                  items: { type: array, items: { oneOf: [ { $ref: '#/components/schemas/SyntheticSpaceGalleryPhoto' }, { $ref: '#/components/schemas/SpaceMediaPhoto' } ] } }
                  max_photos: { type: integer, const: 10 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSyntheticOwnSpaceGalleryPhoto
      tags: [M04 local]
      description: >-
        Sin cuerpo conserva la generación del PNG sintético. Con multipart/form-data y campo image admite JPEG, PNG y WebP estático, normaliza derivados WebP y los guarda en el namespace privado media/v1. Requiere rol arrendador, propiedad del espacio, bearer y clave de idempotencia; máximo común de 10 fotos.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema: {type: object, required: [image], properties: {image: {type: string, format: binary}}, additionalProperties: false}
      responses:
        '200': { description: Resultado reutilizado de un reintento idempotente., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/SyntheticSpaceGalleryPhotoEnvelope' }, { $ref: '#/components/schemas/SpaceMediaPhotoEnvelope' }] } } } }
        '201': { description: Imagen sintética o foto real normalizada a WebP., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/SyntheticSpaceGalleryPhotoEnvelope' }, { $ref: '#/components/schemas/SpaceMediaPhotoEnvelope' }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Storage privado temporalmente no disponible., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /spaces/{spaceId}/cover:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: selectOwnSyntheticSpaceCover
      tags: [M04 local]
      description: >-
        Selecciona como portada una imagen PNG sintética activa de la galería propia. La selección queda ligada al mismo espacio y titular; retirar la imagen elimina la selección en la misma transacción. El archivo continúa privado y no se expone automáticamente al catálogo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photo_id]
              properties:
                photo_id: { type: string, format: uuid }
      responses:
        '200': { description: Portada seleccionada., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticSpaceCover' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/gallery/{photoId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnSyntheticSpaceGalleryPhoto
      tags: [M04 local]
      responses:
        '200': { description: Metadatos de una imagen activa propia., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/SyntheticSpaceGalleryPhoto' }, { $ref: '#/components/schemas/SpaceMediaPhoto' }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOwnSpaceMediaPhoto
      tags: [IMG-01 media]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, minProperties: 1, properties: {alt_text: {type: string, maxLength: 250}, visible: {type: boolean}, position: {type: integer, minimum: 1, maximum: 10}}}
      responses:
        '200': {description: Metadata de imagen real actualizada., content: {application/json: {schema: {$ref: '#/components/schemas/SpaceMediaPhoto'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    delete:
      operationId: removeOwnSyntheticSpaceGalleryPhoto
      tags: [M04 local]
      description: Retira la imagen propia y encola limpieza recuperable del archivo privado.
      responses:
        '200': { description: Resultado idempotente de la retirada., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticSpaceGalleryRemoval' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/gallery/{photoId}/publication:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setOwnSyntheticSpaceGalleryPhotoPublication
      tags: [M04 local]
      description: Declara o retira explícitamente una foto sintética de la ficha pública. La portada solo se muestra mientras también sea pública.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_in_catalog]
              properties:
                public_in_catalog: { type: boolean }
      responses:
        '200': { description: Estado de publicación de la imagen propia., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticSpaceGalleryPhoto' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/gallery/{photoId}/content:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnSyntheticSpaceGalleryPhotoContent
      tags: [M04 local]
      description: Autoriza de nuevo al titular en cada consulta; responde PNG privado sin URL persistente.
      responses:
        '200': { description: Contenido PNG sintético., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Storage privado temporalmente no disponible., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /spaces/{spaceId}/gallery/{photoId}/variants/{variant}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: variant, in: path, required: true, schema: { type: string, enum: [display, thumbnail] } }
    get:
      operationId: getOwnSpaceMediaVariant
      tags: [IMG-01 media]
      description: Sirve WebP privado mediante autorización del titular en cada solicitud. Nunca expone bucket, object key ni generación.
      responses:
        '200': {description: Variante WebP privada, content: {image/webp: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Storage privado temporalmente no disponible.}
  /spaces/{spaceId}/availability:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: configureOwnDraftAvailability
      tags: [M04/M06 local]
      description: >-
        Configura una zona IANA explícita para el borrador propio. Para un espacio activo u oculto heredado,
        solo repara una zona ausente y solo si no tiene reservas; nunca reemplaza una zona existente ni
        asigna un valor automáticamente. La autorización se limita al titular autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityConfig' }
      responses:
        '200':
          description: Zona horaria configurada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: queryOwnDraftAvailability
      tags: [M04/M06 local]
      description: Comprueba intervalos finitos contra ocupaciones activas. El calendario `ocupacion` sigue siendo propiedad de M06.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
      responses:
        '200':
          description: Resultado de disponibilidad del espacio propio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/tariff:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnSpaceTariff
      tags: [M05 local]
      description: Consulta la versión vigente de la tarifa base CLP del espacio propio en estado borrador, activo u oculto.
      responses:
        '200': { description: Tarifa vigente, content: { application/json: { schema: { $ref: '#/components/schemas/Rate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOwnSpaceTariff
      tags: [M05 local]
      description: >-
        Actualiza la tarifa del espacio propio en estado borrador, activo u oculto creando una versión inmutable. Una modalidad incompatible con un horario semanal activo responde conflicto y no cambia la tarifa. Cotizaciones, reservas y simulaciones existentes conservan sus snapshots. No cambia el estado de publicación.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RateInput' } }
      responses:
        '200': { description: Nueva versión, content: { application/json: { schema: { $ref: '#/components/schemas/Rate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/tariffs:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listOwnSpaceTariffVersions
      tags: [M05 local]
      description: Lista versiones inmutables de tarifa del espacio propio en estado borrador, activo u oculto.
      responses:
        '200': { description: Historial de tarifas, content: { application/json: { schema: { $ref: '#/components/schemas/RateList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/price-simulations:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createPrivateOwnDraftPriceSimulation
      tags: [M05 local]
      description: 'Persiste una simulación privada del precio base si M06 confirma disponibilidad. Conserva snapshot de tarifa/versión/unidades/CLP/zona; no crea ocupación, retención, reserva, confirmación ni publicación. Horas transcurridas y fechas/meses calendario locales iniciados según aniversario local; ver decisión M05.'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PriceSimulationInput' } }
      responses:
        '201': { description: Simulación privada guardada, content: { application/json: { schema: { $ref: '#/components/schemas/PriceSimulation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/price-simulations/{simulationId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: simulationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnPrivatePriceSimulation
      tags: [M05 local]
      description: Consulta el snapshot privado del titular sin recalcularlo con la tarifa actual.
      responses:
        '200': { description: Snapshot de simulación, content: { application/json: { schema: { $ref: '#/components/schemas/PriceSimulation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/availability/blocks:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOwnDraftManualBlocks
      tags: [M04/M06 local]
      description: Lista los bloqueos manuales activos propios que intersectan el rango consultado.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
      responses:
        '200':
          description: Calendario manual del borrador propio.
