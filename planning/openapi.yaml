        parcialmente firmada se anula; una versión ya firmada queda como hecho
        histórico y la reserva puede cancelarse con devolución fake.
        La transacción cancela, libera ocupacion, agrega historial y una obligación
        de devolución fake por el subtotal pagado. La respuesta no confirma que la
        devolución haya sido procesada. Política local_flexible_v1 solo para fixtures.
