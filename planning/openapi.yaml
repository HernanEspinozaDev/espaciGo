          type: string
          const: accepted
        message:
          type: string
  examples:
    Accepted:
      summary: Respuesta 2xx sintética; cada operación define su esquema final.
      value:
        id: 00000000-0000-4000-8000-000000000001
    InternalError:
      summary: Error interno genérico sin información sensible.
      value:
