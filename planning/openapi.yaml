        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/local/damage-claims/{claimID}:
    parameters: [{ name: claimID, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getAdminLocalSyntheticDamageClaim
      tags: [M10 local]
      description: Solo administrador; incluye estado, historial y evidencia privada ligada al reclamo.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Detalle de reclamo para revisión., content: { application/json: { schema: { $ref: '#/components/schemas/LocalDamageClaimEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/local/damage-claims/{claimID}/evidence/{evidenceID}:
    parameters:
      - { name: claimID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: evidenceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminLocalDamageClaimEvidence
      tags: [M10 local]
      description: Descarga inline solo de PNG sintéticos asociados al reclamo, con rol administrador.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: PNG sintético privado., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/local/damage-claims/{claimID}/resolution:
    parameters: [{ name: claimID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: resolveLocalSyntheticDamageClaim
      tags: [M10 local]
      description: Solo administrador. Cierra el reclamo de forma transaccional e idempotente con resultado y motivo estructurado. No asigna montos ni mueve fondos; garantía, deducciones, captura, liberación y devoluciones quedan para LOCAL-FIN-01.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalDamageClaimResolutionInput' }
      responses:
        '201': { description: Reclamo resuelto; reserva y registros financieros no se modifican., content: { application/json: { schema: { $ref: '#/components/schemas/LocalDamageClaimEnvelope' } } } }
        '200': { description: Reintento idempotente reutilizado., content: { application/json: { schema: { $ref: '#/components/schemas/LocalDamageClaimEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave opaca que identifica una misma operación para reintentos seguros.
      schema:
        type: string
        minLength: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Credencial de acceso protegida por TLS. Esta base no fija formato, emisor ni ciclo de vida
        del token; cada operación declara sus excepciones.
  headers:
    X-Request-ID:
      description: Identificador de correlación generado o propagado por el servidor.
      schema:
        type: string
        format: uuid
    WWW-Authenticate:
      description: Desafío Bearer que acompaña una respuesta 401.
      schema:
        type: string
      example: Bearer
    Idempotency-Key:
      description: Clave opaca del cliente para repetir de forma segura una operación elegible.
      schema:
        type: string
        minLength: 1
  schemas:
    AdminCapability:
      type: string
      enum: [legacy.administration, accounts.list, accounts.read, accounts.update, accounts.block, accounts.roles, publications.list, publications.read, publications.update, publications.moderate, publications.retire, admin_access.manage, kpi.read, audit.read, audit.export]
    GlobalAdminMeEnvelope:
      type: object
      required: [data]
      properties:
        data: {type: object, required: [account_id, roles, capabilities, generated_at], properties: {account_id: {type: string, format: uuid}, roles: {type: array, items: {type: string}}, capabilities: {type: array, items: {$ref: '#/components/schemas/AdminCapability'}}, generated_at: {type: string, format: date-time}}}
    GlobalAdminOverviewEnvelope:
      type: object
      required: [data]
      properties:
        data: {type: object, required: [total_accounts, administrative_blocked, by_state, by_role, generated_at, definition], properties: {total_accounts: {type: integer, format: int64}, administrative_blocked: {type: integer, format: int64}, by_state: {type: object, additionalProperties: {type: integer, format: int64}}, by_role: {type: object, additionalProperties: {type: integer, format: int64}}, generated_at: {type: string, format: date-time}, definition: {type: string}}}
    GlobalAdminAccount:
      type: object
      required: [account_id, email, state, created_at, administrative_blocked, roles, publication_count, reservation_count, incident_count]
      properties:
        account_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: [string, 'null']}
        phone: {type: [string, 'null'], pattern: '^[0-9]{9}$'}
        profile_updated_at: {type: [string, 'null'], format: date-time}
        state: {type: string, enum: [correo_pendiente, activo, bloqueado, baja_solicitada, desidentificado]}
        created_at: {type: string, format: date-time}
        administrative_blocked: {type: boolean}
        roles: {type: array, items: {type: string, enum: [arrendatario, arrendador, administrador, administrador_global]}}
        publication_count: {type: integer, format: int64}
        reservation_count: {type: integer, format: int64}
        incident_count: {type: integer, format: int64}
    GlobalAdminAccountEnvelope:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/GlobalAdminAccount'}}
    GlobalAdminAccountPageEnvelope:
      type: object
      required: [data]
      properties:
        data: {type: object, required: [items, next_cursor, matching_total, generated_at], properties: {items: {type: array, items: {$ref: '#/components/schemas/GlobalAdminAccount'}}, next_cursor: {type: string}, matching_total: {type: integer, format: int64}, generated_at: {type: string, format: date-time}}}
