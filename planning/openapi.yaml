openapi: 3.1.0
info:
  title: EspaciGo API
  version: 1.0.0
  description: 'Prototipo local M01, cortes parciales M02/M03/M04/M05 y calendario privado M06. M03 usa casos KYC/KYB sintéticos; no consulta Registro Civil/SII ni declara identidad acreditada. M04 conserva borradores privados; disponibilidad usa ocupacion M06. M05 versiona tarifas/simulaciones privadas; M06 habilita en perfil local un fixture de reserva con fake sin cobro real. M02 conserva pendientes productivos; historial y avisos durables RQF-217/218 dependen de DB02-09.'
servers:
- url: /api/v1
  description: Base relativa versionada; el host se configura por entorno.
security:
- bearerAuth: []
paths:
  /auth/terms:
    get:
      operationId: listLocalTerms
      tags:
      - M01 local
      description: Versiones sintéticas para CU-01; no textos legales productivos.
      responses:
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '404': &id003
          $ref: '#/components/responses/NotFound'
        '405': &id004
          $ref: '#/components/responses/MethodNotAllowed'
        '415': &id005
          $ref: '#/components/responses/UnsupportedMediaType'
        '422': &id006
          $ref: '#/components/responses/UnprocessableEntity'
        '429': &id007
          $ref: '#/components/responses/TooManyRequests'
        '500': &id008
          $ref: '#/components/responses/InternalServerError'
        '503': &id009
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsResponse'
      security: []
  /auth/register:
    post:
      operationId: registerAccount
      tags:
      - M01 local
      description: 'CU-01/RQF-001–007/186–187; cuenta, arrendatario y términos atómicos. Duplicado CU-01 A1
        explícito. Si emisión/correo falla después del commit, 202 con ID pendiente: reemitir, no repetir alta.
        Sin preferencia RQF-213 (DB02-09).'
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '201':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'
        '202':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/verification/reissue:
    post:
      operationId: reissueVerification
      tags:
      - M01 local
      description: CU-02/RQF-188; TTL 24 h, invalida token anterior; 3 emisiones/cuenta/h más cuota IP local.
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '204':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /auth/verification:
    post:
      operationId: verifyEmail
      tags:
      - M01 local
      description: CU-02/RQF-008–010; ID y secreto en cuerpo; 5 fallos/token, cuota IP. Consumo/activación
        atómicos, no acorta bloqueo de login.
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '204':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
  /auth/password/recovery:
    post:
      operationId: requestPasswordRecovery
      tags: [M01 local]
      description: 'CU-05/RQF-019–020. Siempre responde con el mismo 202 para cuenta elegible/desconocida; cuota por IP puede responder 429. Envío local capturado por Mailpit; token 15 min, reemplazo invalida anterior, máximo 3 emisiones/cuenta/h.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Respuesta genérica anti-enumeración., content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryAccepted' } } } }
        '400': *id001
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
  /auth/password/recovery/consume:
    post:
      operationId: consumePasswordRecovery
      tags: [M01 local]
      description: 'CU-05/RQF-021–022. Token ID/secreto solo en cuerpo, hash en base de datos, 5 intentos. Cambia clave y revoca sesiones atómicamente. No implementa historial RQF-217 mientras DB02-09 no defina retención.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryConsumeRequest' }
      responses:
        '204': { description: Clave actualizada y sesiones revocadas. }
        '400': *id001
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
  /auth/password/change:
    post:
      operationId: changePassword
      tags: [M01 local]
      description: 'CU-50/RQF-214–218. Requiere Bearer y clave actual, rechaza clave idéntica, invalida todas las sesiones y envía correo local tras commit. Historial RQF-217 y entrega durable/outbox RQF-218 dependen de DB02-09.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { description: 'Clave actualizada; sesiones revocadas. El cliente debe borrar el token y volver a iniciar sesión.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': *id004
        '415': *id005
        '422': *id006
        '500': *id008
        '503': *id009
  /profile:
    get:
      operationId: getOwnProfile
      tags: [M02 local]
      description: Perfil solo del titular autenticado. La foto requiere definir storage.
      responses:
        '200': { description: Perfil propio., content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Perfil aún no creado. }
    put:
      operationId: updateOwnProfile
      tags: [M02 local]
      description: Nombre visible y teléfono opcional de nueve dígitos según CU-07.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { description: Perfil propio actualizado., content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': *id006
  /rights-requests:
    get:
      operationId: listOwnRightsRequests
      tags: [M02 local]
      description: Lista solo solicitudes del titular autenticado.
      responses:
        '200': { description: Solicitudes propias., content: { application/json: { schema: { $ref: '#/components/schemas/RightsRequestList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: requestDataRight
      tags: [M02 local]
      description: Registra acceso o supresión en_revision sin borrar/desidentificar datos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RightsRequestCreate' }
      responses:
        '202': { description: Solicitud recibida para revisión., content: { application/json: { schema: { $ref: '#/components/schemas/RightsRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': *id006
  /verifications:
    get:
      operationId: listOwnVerifications
      tags: [M03 local]
      description: Devuelve los casos propios y referencias sintéticas; nunca documentos ni RUT.
      responses:
        '200': { description: Casos propios., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: startSyntheticVerification
      tags: [M03 local]
      description: Crea un caso kyc/kyb sintético en revisión manual. No valida identidad ni consulta proveedor externo. Idempotencia por usuario/clave.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 80 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCreate' }
      responses:
        '201': { description: Caso sintético en revisión., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCase' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': *id006
  /verifications/{id}:
    get:
      operationId: getOwnVerification
      tags: [M03 local]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Caso propio., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCase' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /verifications/{id}/retry:
    post:
      operationId: retryRejectedVerification
      tags: [M03 local]
      description: Reintenta solo casos rechazados del mismo titular; confirma corrección fixture y exige clave idempotente.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 80 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationRetry' }
      responses:
        '201': { description: Reintento nuevo y sintético., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCase' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /verifications/{id}/evidence:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid, description: Caso propio de KYC/KYB } }
    get:
      operationId: listOwnSyntheticEvidence
      tags: [M03 local]
      description: Lista metadatos de fixtures sintéticos de un caso propio; no expone rutas ni URLs públicas.
      responses:
        '200': { description: Evidencias sintéticas propias., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticEvidenceList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: uploadSyntheticEvidence
      tags: [M03 local]
      description: Crea un PNG de fixture fijo en almacenamiento local privado. No acepta archivos arbitrarios ni documentos reales.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyntheticEvidenceCreate' }
      responses:
        '201': { description: Metadatos del fixture persistido., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticEvidence' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': *id006
  /verifications/{id}/evidence/{evidenceId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnSyntheticEvidenceContent
      tags: [M03 local]
      description: Descarga inline un fixture propio con autenticación y Cache-Control no-store.
      responses:
        '200': { description: PNG sintético., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteOwnSyntheticEvidence
      tags: [M03 local]
      description: Elimina explícitamente solo el archivo sintético y sus metadatos; no elimina el volumen local.
      responses:
        '204': { description: Fixture eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/verifications/{id}/evidence/{evidenceId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: reviewSyntheticEvidenceContent
      tags: [M03 local]
      description: Descarga el fixture únicamente con el rol administrador de revisión.
      responses:
        '200': { description: PNG sintético., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteReviewedSyntheticEvidence
      tags: [M03 local]
      description: Limpieza explícita del fixture con permiso de revisión.
      responses:
        '204': { description: Fixture eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/verifications/{id}/evidence:
    get:
      operationId: listEvidenceForReview
      tags: [M03 local]
      description: Lista metadatos de evidencias fixture de un caso para el rol administrador de revisión.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Evidencias sintéticas del caso., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticEvidenceList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/verifications:
    get:
      operationId: listPendingVerifications
      tags: [M03 local]
      description: Solo rol administrador; cola de referencias fixture, sin PII.
      responses:
        '200': { description: Casos en revisión., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/verifications/{id}/review:
    post:
      operationId: reviewSyntheticVerification
      tags: [M03 local]
      description: Solo rol administrador. Rechazo requiere motivo codificado. Resolver fixture no acredita identidad real ni habilita transacciones.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationReview' }
      responses:
        '200': { description: Caso sintético resuelto., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCase' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      operationId: login
      tags:
      - M01 local
      description: 'CU-03/04: credencial incorrecta genérica 401, no verificada 403, bloqueo 429. Sesión 8
        h absoluta, idle 30 min.'
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '200':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/session:
    get:
      operationId: currentSession
      tags:
      - M01 local
      description: Consulta solo la sesión del Bearer actual y sus roles/estado; no renueva inactividad. No
        acepta IDs de terceros ni parámetros de URL.
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '200':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /spaces/categories:
    get:
      operationId: listSpaceCategories
      tags: [M04 local]
      description: Lista el catálogo versionado de categorías para una sesión válida; no concede permisos comerciales.
      responses:
        '200':
          description: Categorías disponibles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceCategoryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /spaces/categories/{categoryCode}/attributes:
    parameters:
      - name: categoryCode
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSpaceAttributeProfile
      tags: [M04 local]
      description: Entrega el perfil inmutable vigente que describe los campos y validaciones de la categoría.
      responses:
        '200':
          description: Perfil versionado de características.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAttributeProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/categories/{categoryCode}/attributes/{version}:
    parameters:
      - name: categoryCode
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getVersionedSpaceAttributeProfile
      tags: [M04 local]
      description: Devuelve una versión específica e inmutable del perfil, para conservar el contrato de borradores existentes.
      responses:
        '200':
          description: Perfil versionado solicitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAttributeProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces:
    get:
      operationId: listOwnSpaceDrafts
      tags: [M04 local]
      description: Lista exclusivamente borradores cuyo propietario es la cuenta de la sesión.
      responses:
        '200':
          description: Borradores propios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraftList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createOwnSpaceDraft
      tags: [M04 local]
      description: Crea un borrador privado. El propietario se obtiene de la sesión; no hay publicación, reserva ni cobro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceDraftInput' }
      responses:
        '201':
          description: Borrador creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnSpaceDraft
      tags: [M04 local]
      description: Consulta borrador propio; un recurso ajeno o inexistente responde 404.
      responses:
        '200':
          description: Borrador propio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOwnSpaceDraft
      tags: [M04 local]
      description: Reemplaza los campos de un borrador propio; no permite cambios de estado comercial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceDraftInput' }
      responses:
        '200':
          description: Borrador actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/availability:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: configureOwnDraftAvailability
      tags: [M04/M06 local]
      description: Configura una zona horaria IANA explícita para el borrador propio; no concede publicación comercial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityConfig' }
      responses:
        '200':
          description: Zona horaria configurada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      operationId: queryOwnDraftAvailability
      tags: [M04/M06 local]
      description: Comprueba intervalos finitos contra ocupaciones activas. El calendario `ocupacion` sigue siendo propiedad de M06.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
      responses:
        '200':
          description: Resultado de disponibilidad del espacio propio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/tariff:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnDraftTariff
      tags: [M05 local]
      description: Consulta la versión vigente de la tarifa base CLP del borrador propio.
      responses:
        '200': { description: Tarifa vigente, content: { application/json: { schema: { $ref: '#/components/schemas/Rate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOwnDraftTariff
      tags: [M05 local]
      description: Actualiza la tarifa del borrador propio creando una versión inmutable. No publica el borrador.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RateInput' } }
      responses:
        '200': { description: Nueva versión, content: { application/json: { schema: { $ref: '#/components/schemas/Rate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/tariffs:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listOwnDraftTariffVersions
      tags: [M05 local]
      description: Lista versiones inmutables de tarifa del borrador propio.
      responses:
        '200': { description: Historial de tarifas, content: { application/json: { schema: { $ref: '#/components/schemas/RateList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/price-simulations:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createPrivateOwnDraftPriceSimulation
      tags: [M05 local]
      description: 'Persiste una simulación privada del precio base si M06 confirma disponibilidad. Conserva snapshot de tarifa/versión/unidades/CLP/zona; no crea ocupación, retención, reserva, confirmación ni publicación. Horas transcurridas y fechas/meses calendario locales iniciados según aniversario local; ver decisión M05.'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PriceSimulationInput' } }
      responses:
        '201': { description: Simulación privada guardada, content: { application/json: { schema: { $ref: '#/components/schemas/PriceSimulation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/price-simulations/{simulationId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: simulationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnPrivatePriceSimulation
      tags: [M05 local]
      description: Consulta el snapshot privado del titular sin recalcularlo con la tarifa actual.
      responses:
        '200': { description: Snapshot de simulación, content: { application/json: { schema: { $ref: '#/components/schemas/PriceSimulation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/availability/blocks:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOwnDraftManualBlocks
      tags: [M04/M06 local]
      description: Lista los bloqueos manuales activos propios que intersectan el rango consultado.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
      responses:
        '200':
          description: Calendario manual del borrador propio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualBlockList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    post:
      operationId: createOwnDraftManualBlock
      tags: [M04/M06 local]
      description: Crea un intervalo manual finito semiabierto `[inicio, término)` con motivo obligatorio. Un solape activo devuelve 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualBlockInput' }
      responses:
        '201':
          description: Bloqueo manual creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualBlock' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/availability/timezone:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnDraftTimeZone
      tags: [M04/M06 local]
      description: Lee la zona horaria IANA ya configurada para el borrador propio.
      responses:
        '200':
          description: Zona horaria del calendario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /spaces/{spaceId}/availability/blocks/{blockId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: blockId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteOwnDraftManualBlock
      tags: [M04/M06 local]
      description: Desactiva el bloqueo manual del borrador propio; conserva el registro de ocupación.
      responses:
        '204': { description: Bloqueo desactivado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/fixture:
    get:
      operationId: getAuthorizedLocalBookingFixture
      tags: [M06 local]
      description: >-
        Compatibilidad con M06-LOCAL-01: retorna el primer fixture autorizado
        para esa cuenta. Para seleccionar entre varios fixtures usa el catálogo
        y detalle; cotizar siempre requiere el space_id explícito. No es
        búsqueda pública ni permiso comercial.
      responses:
        '200': { description: Fixture privado con el banner de ensayo., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingFixtureEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/catalog:
    get:
      operationId: searchAuthorizedLocalSyntheticCatalog
      tags: [M05 local]
      description: Lista solo espacios sintéticos allowlisted para uno de sus participantes. Los borradores restantes y las direcciones privadas no se exponen; la disponibilidad consulta ocupacion para el intervalo indicado.
      parameters:
        - { name: category_code, in: query, required: false, schema: { type: string, enum: [oficina, sala_multiproposito, bodega, estacionamiento, local_flexible, stand, quincho, parcela_eventos] } }
        - { name: start_at, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: end_at, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Resultados de catálogo local con banner de ensayo., content: { application/json: { schema: { $ref: '#/components/schemas/LocalCatalogEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/catalog/{spaceId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAuthorizedLocalSyntheticCatalogDetail
      tags: [M05 local]
      description: Devuelve el detalle seguro de un fixture explícitamente habilitado para uno de sus participantes, incluyendo categoría, perfil/atributos, tarifa y zona del mismo espacio.
      responses:
        '200': { description: Detalle del fixture con aviso local., content: { application/json: { schema: { $ref: '#/components/schemas/LocalCatalogDetailEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/quotes:
    post:
      operationId: quoteAuthorizedLocalBooking
      tags: [M06 local]
      description: Cotiza sin ocupar; conserva snapshot de tarifa y zona del borrador. Caducidad provisional configurable de 15 minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_id, start_at, end_at]
              properties:
                space_id: { type: string, format: uuid }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
      responses:
        '200': { description: Cotización snapshot de ensayo local., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingQuoteEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/reservations:
    get:
      operationId: listOwnLocalTrialReservations
      tags: [M06 local]
      description: Historial de reservas del participante autenticado en el fixture privado.
      responses:
        '200': { description: Historial y aviso ENSAYO LOCAL — SIN COBRO REAL., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: requestLocalTrialReservation
      tags: [M06 local]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string, format: uuid }
      responses:
        '201': { description: Retención en ocupacion y reserva pendiente de pago dentro de una transacción., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingReservationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /local/booking-trial/reservations/{reservationId}:
    parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getOwnLocalTrialReservation
      tags: [M06 local]
      responses:
        '200': { description: Estado, snapshot e historial autorizado., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingDetailEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/reservations/{reservationId}/payment:
    post:
      operationId: simulateLocalTrialPayment
      tags: [M06 local]
      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      description: Adaptador fake solo con LOCAL_BOOKING_TRIAL=1; admite exito, rechazo o sin_respuesta. Nunca se conecta a una pasarela.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [outcome], properties: { outcome: { type: string, enum: [exito, rechazo, sin_respuesta] } } }
      responses:
        '200': { description: Resultado de ensayo con banner no-cobro., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingReservationEnvelope' } } } }
        '504': { description: Timeout simulado; la reserva sigue pendiente., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingTimeoutEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /local/booking-trial/reservations/{reservationId}/decision:
    post:
      operationId: decideLocalTrialReservation
      tags: [M06 local]
      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [aprobar, rechazar] } } }
      responses:
        '200': { description: Aprobación o rechazo del participante anfitrión., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingReservationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /local/booking-trial/reservations/{reservationId}/cancel:
    post:
      operationId: cancelPendingLocalTrialReservation
      tags: [M06 local]
      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Cancelación permitida solamente antes del pago., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingReservationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /local/booking-trial/reservations/{reservationId}/messages:
    parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listOwnLocalReservationMessages
      tags: [M09 local]
      description: >-
        Solo participantes leen. Devuelve los mensajes más recientes ordenados
        por secuencia ascendente; before es la secuencia exclusiva del cursor
        y older_cursor permite cargar la página previa. Conserva lectura en
        estados terminales.
      parameters:
        - { name: before, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Página de texto sintético de la conversación., content: { application/json: { schema: { $ref: '#/components/schemas/LocalReservationMessagesPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    post:
      operationId: sendOwnLocalReservationMessage
      tags: [M09 local]
      description: Envío idempotente solo en pendiente_de_pago, pagada y aprobada_host. No agrega notificaciones ni tiempo real.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: Mensaje persistido; replay idéntico devuelve el mismo mensaje., content: { application/json: { schema: { $ref: '#/components/schemas/LocalReservationMessageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/reservations/{reservationId}/messages/read:
    post:
      operationId: advanceOwnLocalReservationMessageReadCursor
      tags: [M09 local]
      description: >-
        Solo el anfitrión o arrendatario de la reserva. Avanza de forma
        monotónica el cursor propio hasta una secuencia de mensaje del mismo
        hilo. El mock lo solicita únicamente después de mostrar correctamente
        la página reciente; no confirma lectura a la contraparte.
      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [through_sequence]
              properties:
                through_sequence: { type: integer, format: int64, minimum: 1 }
      responses:
        '200': { description: Cursor propio persistido y monotónico., content: { application/json: { schema: { $ref: '#/components/schemas/LocalReservationReadCursorEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /auth/logout:
    post:
      operationId: logout
      tags:
      - M01 local
      description: 'CU-06/RQF-023: requiere sesión válida; revoca credencial. Replay/expirada devuelve 401.'
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '204':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Credencial de acceso protegida por TLS. Esta base no fija formato, emisor ni ciclo de vida
        del token; cada operación declara sus excepciones.
  headers:
    X-Request-ID:
      description: Identificador de correlación generado o propagado por el servidor.
      schema:
        type: string
        format: uuid
    WWW-Authenticate:
      description: Desafío Bearer que acompaña una respuesta 401.
      schema:
        type: string
      example: Bearer
    Idempotency-Key:
      description: Clave opaca del cliente para repetir de forma segura una operación elegible.
      schema:
        type: string
        minLength: 1
  schemas:
    LocalBookingFixtureEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data:
          type: object
          required: [space_id, title, category, host_id, renter_id, rate_unit, base_price_clp, currency, time_zone]
          properties:
            space_id: { type: string, format: uuid }
            title: { type: string }
            category: { type: string }
            host_id: { type: string, format: uuid }
            renter_id: { type: string, format: uuid }
            rate_unit: { type: string, enum: [hora, dia, mes] }
            base_price_clp: { type: integer, minimum: 5001 }
            currency: { type: string, const: CLP }
            time_zone: { type: string }
    LocalCatalogEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/LocalCatalogItem' } }
    LocalCatalogDetailEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data: { $ref: '#/components/schemas/LocalCatalogItem' }
    LocalCatalogItem:
      type: object
      required: [space_id, category_code, category_name, title, description, rate_unit, base_price_clp, currency, time_zone, profile_version, profile, attributes]
      properties:
        space_id: { type: string, format: uuid }
        category_code: { type: string, enum: [oficina, sala_multiproposito, bodega, estacionamiento, local_flexible, stand, quincho, parcela_eventos] }
        category_name: { type: string }
        title: { type: string }
        description: { type: string }
        rate_unit: { type: string, enum: [hora, dia, mes] }
        base_price_clp: { type: integer }
        currency: { type: string, const: CLP }
        time_zone: { type: string }
        profile_version: { type: integer, minimum: 1 }
        profile: { type: object }
        attributes: { type: object }
        available: { type: boolean }
    LocalBookingQuoteEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data: { $ref: '#/components/schemas/LocalBookingQuote' }
    LocalBookingQuote:
      type: object
      required: [id, space_id, rate_version, rate_unit, unit_price_clp, currency, units, subtotal_clp, start_at, end_at, time_zone, conditions, category_code, profile_version, profile_values, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        rate_version: { type: integer }
        rate_unit: { type: string, enum: [hora, dia, mes] }
        unit_price_clp: { type: integer }
        currency: { type: string, const: CLP }
        units: { type: integer, minimum: 1 }
        subtotal_clp: { type: integer, minimum: 1 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        time_zone: { type: string }
        conditions: { type: string }
        category_code: { type: string, enum: [oficina, sala_multiproposito, bodega, estacionamiento, local_flexible, stand, quincho, parcela_eventos] }
        profile_version: { type: integer, minimum: 1 }
        profile_values: { type: object }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    LocalBookingReservationEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data: { $ref: '#/components/schemas/LocalBookingReservation' }
    LocalBookingTimeoutEnvelope:
      type: object
      required: [data, error, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data: { $ref: '#/components/schemas/LocalBookingReservation' }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: simulated_payment_timeout }
            message: { type: string }
    LocalBookingListEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/LocalBookingReservation' } }
    LocalBookingDetailEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        safety_notice: { type: string, const: "ENSAYO LOCAL — SIN COBRO REAL" }
        data: { $ref: '#/components/schemas/LocalBookingDetail' }
    LocalBookingDetail:
      allOf:
        - $ref: '#/components/schemas/LocalBookingReservation'
        - type: object
          required: [history]
          properties:
            history: { type: array, items: { $ref: '#/components/schemas/LocalBookingTransition' } }
    LocalBookingTransition:
      type: object
      required: [sequence, to, reason, at]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
