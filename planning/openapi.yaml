      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [claim_id, outcome, deduction_clp, reason_code], properties: { claim_id: { type: string, format: uuid }, outcome: { type: string, enum: [acogido, rechazado] }, deduction_clp: { type: integer, minimum: 0, maximum: 50000, description: El Backend limita el importe a la autorización fake confirmada. }, reason_code: { type: string, enum: [dano_acreditado, faltante_acreditado, sin_deduccion] }, evidence_id: { type: string, format: uuid } } }
      responses:
        '200': { description: Decisión persistida e idempotente., content: { application/json: { schema: { $ref: '#/components/schemas/LocalFinancialDecisionEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/payment-events:
    post:
      operationId: receiveAuthenticatedLocalPaymentEvent
      tags: [M06 local]
      security: []
      description: 'Callback exclusivo del fake local. La firma HMAC en X-Local-Payment-Signature se valida antes de persistir. El inbox inmutable deduplica provider_event_id; la reconciliación aplica el evento después y puede recuperarlo tras reiniciar Backend. No corresponde a una firma ni contrato de proveedor real.'
