        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '504': { description: Timeout simulado; la obligación permanece pendiente., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingRefundTimeoutEnvelope' } } } }
