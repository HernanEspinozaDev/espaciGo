        - { name: actor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: resource_type, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: resource_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 60 } }
        - { name: result, in: query, required: false, schema: { type: string, enum: [exito, rechazo] } }
      responses:
        '200':
          description: Archivo JSON minimizado.
          headers:
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocalAuditExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Parámetros inválidos o más de 10.000 eventos; no se devuelve exportación parcial.
