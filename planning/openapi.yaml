      responses:
        '200': { description: Incidencias abiertas., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LocalTrialDispute' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /admin/disputes/{dispute_id}/close:
    post:
      operationId: closeLocalTrialDispute
      tags: [M10 local]
      description: Cierre administrativo del ensayo; no es resolución, garantía ni liquidación.
      parameters:
        - { name: dispute_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties: { reason_code: { type: string, enum: [ensayo_finalizado, registro_erroneo, duplicada] } }
      responses:
        '200': { description: 'Incidencia cerrada; actor, fecha y motivo se conservan en historial.', content: { application/json: { schema: { $ref: '#/components/schemas/LocalTrialDispute' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/logout:
    post:
      operationId: logout
      tags:
      - M01 local
      description: 'CU-06/RQF-023: requiere sesión válida; revoca credencial. Replay/expirada devuelve 401.'
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '204':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /local/booking-trial/reservations/{reservationId}/contract:
    parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: createOrGetSyntheticReservationContract
      tags: [M07 local]
      description: Crea idempotentemente una versión snapshot privada tras aprobación del anfitrión. Documento de ensayo sintético sin validez jurídica.
      responses:
        '200':
          description: 'Contrato local existente o recién generado.'
          content:
            application/json:
              schema:
                type: object
                required: [data, notice]
                properties:
                  data: { $ref: '#/components/schemas/LocalSyntheticContract' }
                  notice: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /local/booking-trial/contracts/{contractId}:
    parameters: [{ name: contractId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getOwnSyntheticContract
      tags: [M07 local]
      responses:
        '200':
          description: 'Estado, snapshot e historial para participantes.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LocalSyntheticContract' }
                  notice: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/contracts/{contractId}/sign:
