        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': *id006
  /profile/photo:
    get:
      operationId: getOwnSyntheticProfilePhoto
      tags: [M02 local]
      description: Metadata de la foto PNG fija generada por Backend; nunca acepta bytes del cliente.
      responses:
        '200': { description: Metadata propia., content: { application/json: { schema: { oneOf: [{type: object, required: [id, fixture_code, mime_type, sha256, size_bytes, created_at], properties: {id: {type: string, format: uuid}, fixture_code: {type: string, enum: [synthetic-png-v1]}, mime_type: {type: string, enum: [image/png]}, sha256: {type: string}, size_bytes: {type: integer}, created_at: {type: string, format: date-time}}}, {$ref: '#/components/schemas/SpaceMediaPhoto'}] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: generateOwnSyntheticProfilePhoto
      tags: [M02 local]
      description: >-
        Sin cuerpo conserva el flujo sintético histórico. Con multipart/form-data y campo image admite JPEG, PNG y WebP estático, aplica límites, orientación y normaliza derivados WebP en almacenamiento privado. Requiere Idempotency-Key y Bearer del titular.
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema: {type: object, required: [image], properties: {image: {type: string, format: binary}}, additionalProperties: false}
      responses:
        '200': { description: Foto propia generada., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': *id006
    delete:
      operationId: removeOwnSyntheticProfilePhoto
      tags: [M02 local]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses:
        '200': { description: Retirada con limpieza privada recuperable. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profile/photo/content:
    get:
      operationId: getOwnSyntheticProfilePhotoContent
      tags: [M02 local]
      description: PNG privado del titular autenticado.
      responses:
        '200': { description: Imagen privada propia (PNG sintético histórico o avatar WebP)., content: { image/png: { schema: { type: string, format: binary } }, image/webp: {schema: {type: string, format: binary}} } }
