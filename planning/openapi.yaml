      responses:
        '200': { description: Resultado de ensayo con banner no-cobro., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingReservationEnvelope' } } } }
        '504': { description: Timeout simulado; la reserva sigue pendiente., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingTimeoutEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/reservations/{reservationId}/settlement:
    parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getOwnLocalSettlement
      tags: [M10 local]
      description: Consulta de solo lectura para participantes; un administrador activo también puede consultar desde su bandeja administrativa. No inicia la transferencia.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Estado e importes separados de la liquidación fake., content: { application/json: { schema: { $ref: '#/components/schemas/LocalSettlementEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: requestLocalFakeSettlement
      tags: [M10 local]
      description: Solo el anfitrión. Persiste una única intención después del check-out + 24 horas y de verificar obligaciones; reintentos reutilizan la misma clave. Timeout queda pendiente y no se presenta como pagado. No incluye garantía ni captura por daños.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [outcome], properties: { outcome: { type: string, enum: [exito, rechazo, sin_respuesta] } } }
      responses:
        '202': { description: Resultado fake persistido o incierto para la misma operación., content: { application/json: { schema: { $ref: '#/components/schemas/LocalSettlementEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/reservations/{reservationId}/settlement-reconcile:
    parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: reconcileLocalFakeSettlement
      tags: [M10 local]
      description: Solo administrador; resuelve una operación incierta persistida sin iniciar una segunda transferencia.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [outcome], properties: { outcome: { type: string, enum: [exito, rechazo] } } }
      responses:
        '200': { description: Resultado persistido, conciliado una sola vez., content: { application/json: { schema: { $ref: '#/components/schemas/LocalSettlementEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /local/booking-trial/reservations/{reservationId}/receipt:
    parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getOwnLocalSettlementReceipt
      tags: [M10 local]
      description: Solo participantes; comprobante JSON de ensayo generado únicamente para una liquidación confirmada. Sin validez fiscal ni movimientos reales.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Comprobante versionado de ensayo., content: { application/json: { schema: { $ref: '#/components/schemas/LocalSettlementReceiptEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/reservations/{reservationId}/guarantee:
    parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getOwnSyntheticReservationGuarantee
      tags: [M10 local]
      description: Devuelve snapshot fijo de CLP 50.000, autorización/captura/liberación separadas y operaciones fake. Solo participantes de la reserva o administrador autorizado; la respuesta nunca incluye datos privados de las partes.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Estado financiero local y operaciones durables., content: { application/json: { schema: { $ref: '#/components/schemas/LocalGuaranteeEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: executeLocalSyntheticGuaranteeOperation
      tags: [M10 local]
      description: Arrendatario ejecuta autorización fake luego del pago confirmado. Administrador registra captura o liberación. La misma operación/tipo se reutiliza idempotentemente; timeout queda pendiente para conciliación. Rechazo confirmado solo aplica a autorización; captura/liberación admiten éxito o timeout. La liberación automática de una reserva sin reclamo usa el check-out persistido + 24 horas. Nunca representa movimiento de dinero real.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [kind, amount_clp, outcome], properties: { kind: { type: string, enum: [autorizacion, captura, liberacion] }, amount_clp: { type: integer, minimum: 0, maximum: 50000 }, outcome: { type: string, enum: [exito, rechazo, sin_respuesta], description: Rechazo confirmado solo se admite en autorización. } } }
      responses:
        '202': { description: Operación fake persistida., content: { application/json: { schema: { $ref: '#/components/schemas/LocalGuaranteeOperationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/reservations/{reservationId}/guarantee-reconcile:
    post:
