      operationId: requestPasswordRecovery
      tags: [M01 local]
      description: 'CU-05/RQF-019–020. Siempre responde con el mismo 202 para cuenta elegible/desconocida; cuota por IP puede responder 429. Envío local capturado por Mailpit; token 15 min, reemplazo invalida anterior, máximo 3 emisiones/cuenta/h.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Respuesta genérica anti-enumeración., content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryAccepted' } } } }
        '400': *id001
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
  /auth/password/recovery/consume:
    post:
      operationId: consumePasswordRecovery
      tags: [M01 local]
      description: 'CU-05/RQF-021–022. Token ID/secreto solo en cuerpo, hash en base de datos, 5 intentos. Cambia clave y revoca sesiones atómicamente. No implementa historial RQF-217 mientras DB02-09 no defina retención.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryConsumeRequest' }
      responses:
        '204': { description: Clave actualizada y sesiones revocadas. }
        '400': *id001
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
  /auth/password/change:
    post:
      operationId: changePassword
      tags: [M01 local]
      description: 'CU-50/RQF-214–218. Requiere Bearer y clave actual, rechaza clave idéntica, invalida todas las sesiones y envía correo local tras commit. Historial RQF-217 y entrega durable/outbox RQF-218 dependen de DB02-09.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { description: 'Clave actualizada; sesiones revocadas. El cliente debe borrar el token y volver a iniciar sesión.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': *id004
        '415': *id005
        '422': *id006
        '500': *id008
        '503': *id009
