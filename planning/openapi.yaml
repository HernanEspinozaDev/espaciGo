        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Estado terminal, conflicto de operación o vencimiento de contrato procesado antes de insertar., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
