      description: Solo administrador. Filtros por ID, estado y fecha de creación (RFC3339; desde inclusivo/hasta exclusivo). Orden creada_en DESC e ID DESC. Cursor opaco vinculado a cuenta/filtros. No concilia ni modifica datos de negocio; audita una consulta por petición.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reservation_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: created_from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: created_to, in: query, required: false, description: Hasta exclusivo, schema: { type: string, format: date-time } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 4096 } }
      responses:
        '200': { description: Página sin conteo total., content: { application/json: { schema: { $ref: '#/components/schemas/AdminLocalReservationPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/local/reservations/{reservationID}:
    parameters: [{ name: reservationID, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getAdminLocalReservation
      tags: [LOCAL-ADMIN-01A]
      summary: Consultar historial y finanzas de una reserva sintética
      description: Solo administrador. Respuesta mínima con identificadores de participantes solo mientras sigan vinculados; no expone contacto, credenciales, documentos, mensajes ni payloads privados. Una lectura no inicia operaciones ni procesa vencimientos.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Estado, historial, pago fake, devolución, garantía, deducción y estado relacionado del reclamo., content: { application/json: { schema: { $ref: '#/components/schemas/AdminLocalReservationDetailEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/local/damage-claims:
    get:
      operationId: listOpenLocalSyntheticDamageClaims
      tags: [M10 local]
      description: Solo administrador. Lista reclamos sintéticos abiertos y su evidencia privada para revisión local; nunca devuelve montos ni datos de pagos.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reclamos abiertos., content: { application/json: { schema: { $ref: '#/components/schemas/LocalDamageClaimListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/local/damage-claims/{claimID}:
    parameters: [{ name: claimID, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getAdminLocalSyntheticDamageClaim
      tags: [M10 local]
      description: Solo administrador; incluye estado, historial y evidencia privada ligada al reclamo.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Detalle de reclamo para revisión., content: { application/json: { schema: { $ref: '#/components/schemas/LocalDamageClaimEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/local/damage-claims/{claimID}/evidence/{evidenceID}:
    parameters:
      - { name: claimID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: evidenceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminLocalDamageClaimEvidence
      tags: [M10 local]
      description: Descarga inline solo de PNG sintéticos asociados al reclamo, con rol administrador.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: PNG sintético privado., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/local/damage-claims/{claimID}/resolution:
    parameters: [{ name: claimID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: resolveLocalSyntheticDamageClaim
      tags: [M10 local]
      description: Solo administrador. Cierra el reclamo de forma transaccional e idempotente con resultado y motivo estructurado. No asigna montos ni mueve fondos; garantía, deducciones, captura, liberación y devoluciones quedan para LOCAL-FIN-01.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalDamageClaimResolutionInput' }
      responses:
        '201': { description: Reclamo resuelto; reserva y registros financieros no se modifican., content: { application/json: { schema: { $ref: '#/components/schemas/LocalDamageClaimEnvelope' } } } }
        '200': { description: Reintento idempotente reutilizado., content: { application/json: { schema: { $ref: '#/components/schemas/LocalDamageClaimEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Credencial de acceso protegida por TLS. Esta base no fija formato, emisor ni ciclo de vida
        del token; cada operación declara sus excepciones.
  headers:
    X-Request-ID:
      description: Identificador de correlación generado o propagado por el servidor.
      schema:
        type: string
        format: uuid
    WWW-Authenticate:
      description: Desafío Bearer que acompaña una respuesta 401.
      schema:
        type: string
      example: Bearer
    Idempotency-Key:
      description: Clave opaca del cliente para repetir de forma segura una operación elegible.
      schema:
        type: string
        minLength: 1
  schemas:
    AdminLocalReservationSummary:
      type: object
      required: [id, host_id, renter_id, state, start_at, end_at, subtotal_clp, currency, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        host_id: { type: [string, 'null'], format: uuid, description: null tras retirar vínculo por retención }
        renter_id: { type: [string, 'null'], format: uuid, description: null tras retirar vínculo por retención }
        state: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        subtotal_clp: { type: integer, format: int64 }
        currency: { type: string, enum: [CLP] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminLocalReservationPageEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminLocalReservationSummary' } }
            next_cursor: { type: string }
        safety_notice: { type: string }
    AdminLocalReservationDetailEnvelope:
      type: object
      required: [data, safety_notice]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/AdminLocalReservationSummary'
            - type: object
              required: [space_id, history, rental_payments, rental_payment_operations, refund, guarantee, claim]
              properties:
                space_id: { type: string, format: uuid }
                history:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [sequence, to, at]
                    properties:
                      sequence: { type: integer, format: int64 }
                      from: { type: [string, 'null'] }
                      to: { type: string }
                      actor_id: { type: [string, 'null'], format: uuid }
                      at: { type: string, format: date-time }
                rental_payments: { type: array, items: { type: object, required: [result, amount_clp, at], properties: { result: { type: string }, amount_clp: { type: integer }, at: { type: string, format: date-time } } } }
                rental_payment_operations: { type: array, items: { type: object, required: [id, state, requested_result, created_at, updated_at], properties: { id: { type: string, format: uuid }, state: { type: string }, requested_result: { type: string }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } } }
                refund: { type: [object, 'null'], additionalProperties: true }
                guarantee: { type: [object, 'null'], additionalProperties: true }
                claim: { type: [object, 'null'], additionalProperties: true }
        safety_notice: { type: string }
    LocalReview:
      type: object
      required: [id, rating, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [espacio, arrendatario] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        state: { type: string, enum: [publicada, reportada] }
        comment: { type: string }
