  /local/booking-trial/reservations/{reservationId}/cancel:
    post:
      operationId: cancelLocalTrialReservation
      tags: [M06 local]
      description: >-
        Conserva cancelación pre-pago sin devolución. Para pagada, aprobada_host,
        firma_parcial o lista_para_checkin, solo el arrendatario titular puede
        cancelar estrictamente antes del inicio mediante local_flexible_v1.
        La cancelación y las firmas comparten el bloqueo de reserva: una versión
        parcialmente firmada se anula; una versión ya firmada queda como hecho
        histórico y la reserva puede cancelarse con devolución fake.
        La transacción cancela, libera ocupacion, agrega historial y una obligación
        de devolución fake por el subtotal pagado. La respuesta no confirma que la
        devolución haya sido procesada. Política local_flexible_v1 solo para fixtures.
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { reason: { type: string, description: Motivo opcional; no modifica el cálculo. } }
      responses:
        '200': { description: Cancelación atómica con estado de devolución separado y aviso local no durable., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingCancellationResultEnvelope' } } } }
