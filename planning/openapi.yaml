        - { name: resource_type, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: resource_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 60 } }
        - { name: result, in: query, required: false, schema: { type: string, enum: [exito, rechazo] } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
