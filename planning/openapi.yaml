      responses:
        '200': { description: Cuenta fake propia., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: createOrReplaceOwnSyntheticPayoutAccount
      tags: [M02 local]
      description: Requiere KYC sintético efectivo. No recibe RUT, datos bancarios ni credenciales externas.
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses:
        '200': { description: Cuenta simulada creada o reemplazada., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': *id006
    delete:
      operationId: revokeOwnSyntheticPayoutAccount
      tags: [M02 local]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses:
        '200': { description: Cuenta fake revocada; no existe transferencia real. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rights-requests:
    get:
      operationId: listOwnRightsRequests
      tags: [M02 local]
      description: Lista solo solicitudes del titular autenticado.
      responses:
        '200': { description: Solicitudes propias., content: { application/json: { schema: { $ref: '#/components/schemas/RightsRequestList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: requestDataRight
      tags: [M02 local]
      description: Registra acceso o supresión en_revision sin borrar/desidentificar datos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RightsRequestCreate' }
      responses:
        '202': { description: Solicitud recibida para revisión., content: { application/json: { schema: { $ref: '#/components/schemas/RightsRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': *id006
  /privacy/export:
    get:
      operationId: exportOwnIdentityData
      tags: [M02 local]
      description: >-
        Devuelve una instantánea consistente y limitada a la cuenta autenticada:
        correo proporcionado, estado, preferencia inicial, perfil, roles, aceptaciones
        de términos y solicitudes propias. Excluye hashes, sesiones, tokens, secretos
        y datos de terceros. No equivale a exportación de todas las áreas del producto.
      responses:
        '200': { description: Exportación propia local., content: { application/json: { schema: { $ref: '#/components/schemas/OwnIdentityExport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Cuenta propia no encontrada. }
  /privacy/export/archive:
    get:
      operationId: downloadCompleteOwnDataArchive
      tags: [M02 local]
      description: >-
        Devuelve un ZIP descargable versionado con los datos propios actualmente implementados,
        un manifiesto de secciones/archivos/exclusiones y archivos sintéticos propios disponibles.
        Requiere sesión vigente y sigue disponible aunque una solicitud de supresión esté bloqueada.
        No incluye credenciales, tokens, datos personales de otros participantes, mensajes ajenos,
        payloads de adaptadores ni información administrativa restringida. Cada módulo produce
        una proyección de lectura acotada; la exportación no modifica datos.
      responses:
        '200':
          description: Archivo ZIP propio local.
          headers:
            Content-Disposition: { schema: { type: string }, description: Nombre de descarga del ZIP. }
            Cache-Control: { schema: { type: string }, description: no-store. }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Cuenta propia no encontrada. }
  /privacy/suppression-requests/{request_id}/review:
    post:
      operationId: reviewLocalSuppressionBlockers
      tags: [M02 local]
      description: >-
        Operación exclusiva del rol administrador. Revisa y persiste obligaciones
        locales detectables bajo bloqueo de la cuenta. No ejecuta la baja. Las
        disputas sintéticas abiertas se consultan como obligación. Las retenciones
        sintéticas locales ratificadas permiten determinar elegibilidad, pero no
        ejecutan por sí solas la baja.
        Repetir Idempotency-Key devuelve el mismo resultado.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Evaluación local persistida o reutilizada; ninguna supresión ejecutada.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, outcome, obligations_detected, pending_checks, reviewed_at, reused]
                properties:
                  request_id: { type: string, format: uuid }
                  outcome: { type: string, enum: [bloqueada, elegible, revision_incompleta] }
                  obligations_detected:
                    type: array
                    items: { type: string, enum: [reserva_activa, pago_o_devolucion_pendiente, disputa_abierta, liquidacion_pendiente] }
                  pending_checks:
                    type: array
                    description: fuente_disputas_no_modelada solo puede aparecer al reproducir evaluaciones históricas guardadas antes de V24.
                    items: { type: string, enum: [fuente_disputas_no_modelada, matriz_retencion_historicos_incompleta] }
                  reviewed_at: { type: string, format: date-time }
                  reused: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '404': { description: Solicitud de supresión no encontrada. }
        '409': { description: Clave idempotente reutilizada por otro revisor o solicitud ya no revisable. }
        '422': { description: Clave idempotente ausente o inválida. }
  /privacy/suppression-requests/{request_id}/execute:
    post:
      operationId: executeLocalSyntheticSuppression
      tags: [M02 local]
      description: >-
        Exclusivo de administrador sobre una solicitud del titular. Revalida bajo
        bloqueo reservas, pagos/devoluciones y disputas abiertas. En la baja elegible
        aplica privacidad_local_v1 solo a datos sintéticos; preserva hechos requeridos,
        revoca credenciales y minimiza la cuenta. La respuesta distingue bloqueo,
        limpieza de archivos pendiente y baja con minimización y retención residual;
        nunca afirma anonimización o supresión integral. Idempotente por solicitud y
        clave. El borrado de archivos se recupera desde la cola persistente.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Resultado bloqueado, pendiente de archivos o completado; los reintentos reutilizan el resultado persistido.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status, outcome, decision_code, obligations_detected, removed, retained, pending_files, started_at, reused]
                properties:
                  request_id: { type: string, format: uuid }
                  status: { type: string, enum: [bloqueada, limpieza_pendiente, completada] }
                  outcome: { type: string, enum: [bloqueada, limpieza_pendiente, baja_local_con_minimizacion_y_retencion_residual] }
                  decision_code: { type: string, enum: [supresion_bloqueada_por_obligaciones, baja_elegible_privacidad_local_v1] }
                  obligations_detected:
                    type: array
                    items: { type: string, enum: [reserva_activa, pago_o_devolucion_pendiente, disputa_abierta, liquidacion_pendiente] }
                  removed: { type: array, items: { type: string } }
                  retained: { type: array, items: { type: string } }
                  pending_files: { type: integer, minimum: 0 }
                  started_at: { type: string, format: date-time }
                  completed_at: { type: string, format: date-time }
                  reused: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '404': { description: Solicitud de supresión no encontrada. }
        '409': { description: Clave idempotente incompatible o solicitud no ejecutable. }
        '422': { description: Clave idempotente ausente o inválida. }
        '503': { description: 'La ejecución se completó, pero el registro local externo requiere resincronización; repetir la misma clave no duplica la baja.' }
  /privacy/retention/purge:
    post:
      operationId: purgeExpiredLocalPrivacyData
      tags: [M02 local]
      description: >-
        Operación administrativa local por lotes. Procesa clases sintéticas con
        plazos ratificados e independientes: vínculos de reservas terminales,
        metadata/evidencia de verificación, cotizaciones no convertidas,
        aceptaciones de términos y solicitudes de derechos. El retiro de
        archivos privados usa leases recuperables y no elimina metadata antes
        de confirmar el borrado. No declara supresión integral ni anonimización.
      responses:
        '200':
          description: Conteos estructurados del lote procesado.
          content:
            application/json:
              schema:
                type: object
                required: [scanned, purged, deferred]
                properties:
                  scanned: { type: integer, minimum: 0 }
                  purged: { type: integer, minimum: 0 }
                  deferred: { type: integer, minimum: 0 }
                  outbox_events_purged: { type: integer, minimum: 0 }
                  terms_purged: { type: integer, minimum: 0 }
                  rights_purged: { type: integer, minimum: 0 }
                  quotes_purged: { type: integer, minimum: 0 }
                  verifications_purged: { type: integer, minimum: 0 }
                  evidence_files_queued: { type: integer, minimum: 0 }
                  evidence_files_removed: { type: integer, minimum: 0 }
                  evidence_files_deferred: { type: integer, minimum: 0 }
                  contracts_purged: { type: integer, minimum: 0 }
                  publication_history_purged: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '503': { description: Servicio local de privacidad no disponible. }
  /admin/credential-notices:
    get:
      summary: Listar avisos locales con fallo terminal
      operationId: listTerminalLocalCredentialNotices
      tags: [M01 local]
      description: >-
        Lista avisos de cambio de credenciales en fallo terminal. Solo
        administradores. No incluye destinatario, contenido SMTP, contraseñas,
        tokens ni datos personales de la cuenta.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Eventos terminales recuperables.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [event_id, error_code, total_attempts, cycle_number, cycle_attempts, failed_at, remove_at]
                      properties:
                        event_id: { type: string, format: uuid }
                        error_code: { type: string }
                        total_attempts: { type: integer, minimum: 0 }
                        cycle_number: { type: integer, minimum: 1 }
                        cycle_attempts: { type: integer, minimum: 0, maximum: 8 }
                        failed_at: { type: string, format: date-time }
                        remove_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
  /admin/credential-notices/{event_id}/reopen:
    post:
      summary: Reabrir idempotentemente un ciclo de aviso terminal
      operationId: reopenTerminalLocalCredentialNotice
      tags: [M01 local]
      description: >-
        Reabre de forma idempotente un evento terminal elegible, iniciando un
        ciclo de hasta ocho intentos sin reiniciar el total acumulado. Auditoría
        estructurada y destinatario activo obligatorio. SMTP puede duplicar un
        correo tras una caída entre aceptación SMTP y confirmación en base de
        datos; no se garantiza entrega exactamente una vez.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [smtp_restaurado, reintento_operativo] }
      responses:
        '200':
          description: Ciclo abierto o resultado idempotente reutilizado.
          content:
            application/json:
              schema:
                type: object
                required: [event_id, state, reason_code, idempotency_key, cycle_number, total_attempts, cycle_attempts, started_at, reused]
                properties:
                  event_id: { type: string, format: uuid }
                  state: { type: string, enum: [pendiente] }
                  reason_code: { type: string, enum: [smtp_restaurado, reintento_operativo] }
                  idempotency_key: { type: string }
                  cycle_number: { type: integer, minimum: 2 }
                  total_attempts: { type: integer, minimum: 0 }
                  cycle_attempts: { type: integer, minimum: 0, maximum: 8 }
                  started_at: { type: string, format: date-time }
                  reused: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '404': { description: Evento inexistente o no recuperable. }
        '409': { description: 'Evento entregado, cancelado, destinatario inactivo o clave incompatible.' }
        '422': { description: Motivo o clave idempotente inválidos. }
  /privacy/suppression-requests:
    get:
      operationId: listPendingLocalSuppressionRequests
