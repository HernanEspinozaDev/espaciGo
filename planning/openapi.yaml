openapi: 3.1.0
info:
  title: EspaciGo API
  version: 1.0.0
  description: 'Prototipo local sintético. Reseñas y avisos M09 usan la decisión D-COMM local; no son servicios productivos ni plazos legales.'
servers:
- url: /api/v1
  description: Base relativa versionada; el host se configura por entorno.
security:
- bearerAuth: []
paths:
  /spaces/{spaceID}/reviews:
    get:
      operationId: listActiveSpaceReviews
      security: []
      summary: Reseñas sintéticas de una publicación activa
      parameters:
      - in: path
        name: spaceID
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Reseñas y promedio público minimizado
          content: { application/json: { schema: { $ref: '#/components/schemas/LocalSpaceReviewsEnvelope' } } }
        '404': {$ref: '#/components/responses/NotFound'}
  /local/booking-trial/reservations/{reservationID}/reviews:
    get:
      operationId: listReservationReviews
      summary: Consultar reseñas de una reserva propia
      parameters:
      - in: path
        name: reservationID
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Reseñas visibles para participantes
          content: { application/json: { schema: { $ref: '#/components/schemas/LocalReviewListEnvelope' } } }
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createReservationReview
      summary: Crear una reseña sintética inmutable
      parameters:
      - in: path
        name: reservationID
        required: true
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rating]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string}
      responses:
        '201': {description: Reseña creada, content: {application/json: {schema: {$ref: '#/components/schemas/LocalReviewEnvelope'}}}}
        '200': {description: Reintento idéntico reutiliza la reseña, content: {application/json: {schema: {$ref: '#/components/schemas/LocalReviewEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /local/booking-trial/reservations/{reservationID}/reviews/{reviewID}/report:
    post:
      operationId: reportSpaceReview
      summary: Reportar una reseña del espacio propio
      parameters:
      - {in: path, name: reservationID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: reviewID, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code: {type: string, enum: [insultos_acoso, datos_personales, spam, ajeno_experiencia]}
      responses:
        '201': {description: Reporte creado y reseña marcada reportada, content: {application/json: {schema: {$ref: '#/components/schemas/LocalReviewReportEnvelope'}}}}
        '200': {description: Reintento idéntico reutiliza el reporte, content: {application/json: {schema: {$ref: '#/components/schemas/LocalReviewReportEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /local/reputation/me:
    get:
      operationId: getOwnRenterReputation
      summary: Consultar reputación propia en una vista autenticada
      responses:
        '200': {description: Calificaciones minimizadas recibidas por la cuenta}
  /admin/local/review-reports:
    get:
      operationId: listPendingReviewReports
      summary: Listar reportes pendientes (administrador)
      responses:
        '200': {description: Cola local de moderación, content: {application/json: {schema: {$ref: '#/components/schemas/LocalReviewReportListEnvelope'}}}}
  /admin/local/review-reports/{reportID}/{action}:
    post:
      operationId: moderateReviewReport
      summary: Desestimar u ocultar con motivo (administrador)
      parameters:
      - {in: path, name: reportID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: action, required: true, schema: {type: string, enum: [dismiss, hide]}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code, correlation_id]
              properties:
                reason_code: {type: string, enum: [sin_infraccion, contenido_inadecuado, duplicado, error_registro]}
                correlation_id: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200': {description: Decisión de moderación persistida, content: {application/json: {schema: {$ref: '#/components/schemas/LocalReviewReportEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/local/notices:
    get:
      operationId: listTerminalLocalNotices
      summary: Listar avisos con fallo terminal (administrador)
      responses:
        '200': {description: Eventos terminales locales sin secretos ni contenido SMTP, content: {application/json: {schema: {$ref: '#/components/schemas/LocalNoticeListEnvelope'}}}}
  /admin/local/notices/{noticeID}/reopen:
    post:
      operationId: reopenLocalNotice
      summary: Reabrir un ciclo terminal con motivo estructurado
      parameters:
      - {in: path, name: noticeID, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code, correlation_id]
              properties:
                reason_code: {type: string, enum: [smtp_restaurado, reintento_operativo]}
                correlation_id: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201': {description: Nuevo ciclo durable, content: {application/json: {schema: {$ref: '#/components/schemas/LocalNoticeRecoveryEnvelope'}}}}
        '200': {description: Reintento idempotente reutilizado, content: {application/json: {schema: {$ref: '#/components/schemas/LocalNoticeRecoveryEnvelope'}}}}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /auth/terms:
    get:
      operationId: listLocalTerms
      tags:
      - M01 local
      description: Versiones sintéticas para CU-01; no textos legales productivos.
      responses:
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '404': &id003
          $ref: '#/components/responses/NotFound'
        '405': &id004
          $ref: '#/components/responses/MethodNotAllowed'
        '415': &id005
          $ref: '#/components/responses/UnsupportedMediaType'
        '422': &id006
          $ref: '#/components/responses/UnprocessableEntity'
        '429': &id007
          $ref: '#/components/responses/TooManyRequests'
        '500': &id008
          $ref: '#/components/responses/InternalServerError'
        '503': &id009
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsResponse'
      security: []
  /auth/register:
    post:
      operationId: registerAccount
      tags:
      - M01 local
      description: 'CU-01/RQF-001–007/186–187/213; cuenta, arrendatario, preferencia inicial no excluyente y términos atómicos. Duplicado CU-01 A1
        explícito. Si emisión/correo falla después del commit, 202 con ID pendiente: reemitir, no repetir alta.
        La preferencia no concede rol ni restringe actividades futuras.'
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '201':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'
        '202':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/verification/reissue:
    post:
      operationId: reissueVerification
      tags:
      - M01 local
      description: CU-02/RQF-188; TTL 24 h, invalida token anterior; 3 emisiones/cuenta/h más cuota IP local.
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '204':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /auth/verification:
    post:
      operationId: verifyEmail
      tags:
      - M01 local
      description: CU-02/RQF-008–010; ID y secreto en cuerpo; 5 fallos/token, cuota IP. Consumo/activación
        atómicos, no acorta bloqueo de login.
      responses:
        '400': *id001
        '403': *id002
        '404': *id003
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
        '204':
          description: Operación completada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
  /auth/password/recovery:
    post:
      operationId: requestPasswordRecovery
      tags: [M01 local]
      description: 'CU-05/RQF-019–020. Siempre responde con el mismo 202 para cuenta elegible/desconocida; cuota por IP puede responder 429. Envío local capturado por Mailpit; token 15 min, reemplazo invalida anterior, máximo 3 emisiones/cuenta/h.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Respuesta genérica anti-enumeración., content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryAccepted' } } } }
        '400': *id001
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
  /auth/password/recovery/consume:
    post:
      operationId: consumePasswordRecovery
      tags: [M01 local]
      description: 'CU-05/RQF-021–022. Token ID/secreto solo en cuerpo, hash en base de datos, 5 intentos. Cambia clave y revoca sesiones atómicamente. No implementa historial RQF-217 mientras DB02-09 no defina retención.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryConsumeRequest' }
      responses:
        '204': { description: Clave actualizada y sesiones revocadas. }
        '400': *id001
        '405': *id004
        '415': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
  /auth/password/change:
    post:
      operationId: changePassword
      tags: [M01 local]
      description: 'CU-50/RQF-214–218. Requiere Bearer y clave actual, rechaza clave idéntica, invalida todas las sesiones y envía correo local tras commit. Historial RQF-217 y entrega durable/outbox RQF-218 dependen de DB02-09.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { description: 'Clave actualizada; sesiones revocadas. El cliente debe borrar el token y volver a iniciar sesión.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': *id004
        '415': *id005
        '422': *id006
        '500': *id008
        '503': *id009
  /profile:
    get:
      operationId: getOwnProfile
      tags: [M02 local]
      description: Perfil solo del titular autenticado. La foto sintética se administra mediante /profile/photo.
      responses:
        '200': { description: Perfil propio., content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Perfil aún no creado. }
    put:
      operationId: updateOwnProfile
      tags: [M02 local]
      description: Nombre visible y teléfono opcional de nueve dígitos según CU-07.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { description: Perfil propio actualizado., content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': *id006
  /profile/photo:
    get:
      operationId: getOwnSyntheticProfilePhoto
      tags: [M02 local]
      description: Metadata de la foto PNG fija generada por Backend; nunca acepta bytes del cliente.
      responses:
        '200': { description: Metadata propia., content: { application/json: { schema: { type: object, required: [id, fixture_code, mime_type, sha256, size_bytes, created_at], properties: { id: {type: string, format: uuid}, fixture_code: {type: string, enum: [synthetic-png-v1]}, mime_type: {type: string, enum: [image/png]}, sha256: {type: string}, size_bytes: {type: integer}, created_at: {type: string, format: date-time} } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: generateOwnSyntheticProfilePhoto
      tags: [M02 local]
      description: Genera/reemplaza el fixture fijo en almacenamiento privado. No admite multipart ni imagen arbitraria.
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses:
        '200': { description: Foto propia generada., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': *id006
    delete:
      operationId: removeOwnSyntheticProfilePhoto
      tags: [M02 local]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses:
        '200': { description: Retirada con limpieza privada recuperable. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profile/photo/content:
    get:
      operationId: getOwnSyntheticProfilePhotoContent
      tags: [M02 local]
      description: PNG privado del titular autenticado.
      responses:
        '200': { description: PNG sintético propio., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payout-account:
    get:
      operationId: getOwnSyntheticPayoutAccount
      tags: [M02 local]
      description: Referencia ficticia del adaptador local; no contiene datos bancarios.
      responses:
        '200': { description: Cuenta fake propia., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: createOrReplaceOwnSyntheticPayoutAccount
      tags: [M02 local]
      description: Requiere KYC sintético efectivo. No recibe RUT, datos bancarios ni credenciales externas.
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses:
        '200': { description: Cuenta simulada creada o reemplazada., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': *id006
    delete:
      operationId: revokeOwnSyntheticPayoutAccount
      tags: [M02 local]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses:
        '200': { description: Cuenta fake revocada; no existe transferencia real. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rights-requests:
    get:
      operationId: listOwnRightsRequests
      tags: [M02 local]
      description: Lista solo solicitudes del titular autenticado.
      responses:
        '200': { description: Solicitudes propias., content: { application/json: { schema: { $ref: '#/components/schemas/RightsRequestList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: requestDataRight
      tags: [M02 local]
      description: Registra acceso o supresión en_revision sin borrar/desidentificar datos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RightsRequestCreate' }
      responses:
        '202': { description: Solicitud recibida para revisión., content: { application/json: { schema: { $ref: '#/components/schemas/RightsRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': *id006
  /privacy/export:
    get:
      operationId: exportOwnIdentityData
      tags: [M02 local]
      description: >-
        Devuelve una instantánea consistente y limitada a la cuenta autenticada:
        correo proporcionado, estado, preferencia inicial, perfil, roles, aceptaciones
        de términos y solicitudes propias. Excluye hashes, sesiones, tokens, secretos
        y datos de terceros. No equivale a exportación de todas las áreas del producto.
      responses:
        '200': { description: Exportación propia local., content: { application/json: { schema: { $ref: '#/components/schemas/OwnIdentityExport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Cuenta propia no encontrada. }
  /privacy/export/archive:
    get:
      operationId: downloadCompleteOwnDataArchive
      tags: [M02 local]
      description: >-
        Devuelve un ZIP descargable versionado con los datos propios actualmente implementados,
        un manifiesto de secciones/archivos/exclusiones y archivos sintéticos propios disponibles.
        Requiere sesión vigente y sigue disponible aunque una solicitud de supresión esté bloqueada.
        No incluye credenciales, tokens, datos personales de otros participantes, mensajes ajenos,
        payloads de adaptadores ni información administrativa restringida. Cada módulo produce
        una proyección de lectura acotada; la exportación no modifica datos.
      responses:
        '200':
          description: Archivo ZIP propio local.
          headers:
            Content-Disposition: { schema: { type: string }, description: Nombre de descarga del ZIP. }
            Cache-Control: { schema: { type: string }, description: no-store. }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Cuenta propia no encontrada. }
  /privacy/suppression-requests/{request_id}/review:
    post:
      operationId: reviewLocalSuppressionBlockers
      tags: [M02 local]
      description: >-
        Operación exclusiva del rol administrador. Revisa y persiste obligaciones
        locales detectables bajo bloqueo de la cuenta. No ejecuta la baja. Las
        disputas sintéticas abiertas se consultan como obligación. Las retenciones
        sintéticas locales ratificadas permiten determinar elegibilidad, pero no
        ejecutan por sí solas la baja.
        Repetir Idempotency-Key devuelve el mismo resultado.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Evaluación local persistida o reutilizada; ninguna supresión ejecutada.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, outcome, obligations_detected, pending_checks, reviewed_at, reused]
                properties:
                  request_id: { type: string, format: uuid }
                  outcome: { type: string, enum: [bloqueada, elegible, revision_incompleta] }
                  obligations_detected:
                    type: array
                    items: { type: string, enum: [reserva_activa, pago_o_devolucion_pendiente, disputa_abierta] }
                  pending_checks:
                    type: array
                    description: fuente_disputas_no_modelada solo puede aparecer al reproducir evaluaciones históricas guardadas antes de V24.
                    items: { type: string, enum: [fuente_disputas_no_modelada, matriz_retencion_historicos_incompleta] }
                  reviewed_at: { type: string, format: date-time }
                  reused: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '404': { description: Solicitud de supresión no encontrada. }
        '409': { description: Clave idempotente reutilizada por otro revisor o solicitud ya no revisable. }
        '422': { description: Clave idempotente ausente o inválida. }
  /privacy/suppression-requests/{request_id}/execute:
    post:
      operationId: executeLocalSyntheticSuppression
      tags: [M02 local]
      description: >-
        Exclusivo de administrador sobre una solicitud del titular. Revalida bajo
        bloqueo reservas, pagos/devoluciones y disputas abiertas. En la baja elegible
        aplica privacidad_local_v1 solo a datos sintéticos; preserva hechos requeridos,
        revoca credenciales y minimiza la cuenta. La respuesta distingue bloqueo,
        limpieza de archivos pendiente y baja con minimización y retención residual;
        nunca afirma anonimización o supresión integral. Idempotente por solicitud y
        clave. El borrado de archivos se recupera desde la cola persistente.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Resultado bloqueado, pendiente de archivos o completado; los reintentos reutilizan el resultado persistido.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status, outcome, decision_code, obligations_detected, removed, retained, pending_files, started_at, reused]
                properties:
                  request_id: { type: string, format: uuid }
                  status: { type: string, enum: [bloqueada, limpieza_pendiente, completada] }
                  outcome: { type: string, enum: [bloqueada, limpieza_pendiente, baja_local_con_minimizacion_y_retencion_residual] }
                  decision_code: { type: string, enum: [supresion_bloqueada_por_obligaciones, baja_elegible_privacidad_local_v1] }
                  obligations_detected:
                    type: array
                    items: { type: string, enum: [reserva_activa, pago_o_devolucion_pendiente, disputa_abierta] }
                  removed: { type: array, items: { type: string } }
                  retained: { type: array, items: { type: string } }
                  pending_files: { type: integer, minimum: 0 }
                  started_at: { type: string, format: date-time }
                  completed_at: { type: string, format: date-time }
                  reused: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '404': { description: Solicitud de supresión no encontrada. }
        '409': { description: Clave idempotente incompatible o solicitud no ejecutable. }
        '422': { description: Clave idempotente ausente o inválida. }
        '503': { description: 'La ejecución se completó, pero el registro local externo requiere resincronización; repetir la misma clave no duplica la baja.' }
  /privacy/retention/purge:
    post:
      operationId: purgeExpiredLocalSyntheticReservationLinks
      tags: [M02 local]
      description: >-
        Operación administrativa local por lotes. Procesa únicamente hechos de
        reservas sintéticas terminales cuya retención de 24 meses ya venció,
        revalidando pagos, devoluciones y disputas bajo bloqueo. Conserva los
        hechos históricos y retira solo vínculos personales; no declara
        supresión integral ni anonimización.
      responses:
        '200':
          description: Conteos estructurados del lote procesado.
          content:
            application/json:
              schema:
                type: object
                required: [scanned, purged, deferred]
                properties:
                  scanned: { type: integer, minimum: 0 }
                  purged: { type: integer, minimum: 0 }
                  deferred: { type: integer, minimum: 0 }
                  outbox_events_purged: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '503': { description: Servicio local de privacidad no disponible. }
  /admin/credential-notices:
    get:
      summary: Listar avisos locales con fallo terminal
      operationId: listTerminalLocalCredentialNotices
      tags: [M01 local]
      description: >-
        Lista avisos de cambio de credenciales en fallo terminal. Solo
        administradores. No incluye destinatario, contenido SMTP, contraseñas,
        tokens ni datos personales de la cuenta.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Eventos terminales recuperables.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [event_id, error_code, total_attempts, cycle_number, cycle_attempts, failed_at, remove_at]
                      properties:
                        event_id: { type: string, format: uuid }
                        error_code: { type: string }
                        total_attempts: { type: integer, minimum: 0 }
                        cycle_number: { type: integer, minimum: 1 }
                        cycle_attempts: { type: integer, minimum: 0, maximum: 8 }
                        failed_at: { type: string, format: date-time }
                        remove_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
  /admin/credential-notices/{event_id}/reopen:
    post:
      summary: Reabrir idempotentemente un ciclo de aviso terminal
      operationId: reopenTerminalLocalCredentialNotice
      tags: [M01 local]
      description: >-
        Reabre de forma idempotente un evento terminal elegible, iniciando un
        ciclo de hasta ocho intentos sin reiniciar el total acumulado. Auditoría
        estructurada y destinatario activo obligatorio. SMTP puede duplicar un
        correo tras una caída entre aceptación SMTP y confirmación en base de
        datos; no se garantiza entrega exactamente una vez.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [smtp_restaurado, reintento_operativo] }
      responses:
        '200':
          description: Ciclo abierto o resultado idempotente reutilizado.
          content:
            application/json:
              schema:
                type: object
                required: [event_id, state, reason_code, idempotency_key, cycle_number, total_attempts, cycle_attempts, started_at, reused]
                properties:
                  event_id: { type: string, format: uuid }
                  state: { type: string, enum: [pendiente] }
                  reason_code: { type: string, enum: [smtp_restaurado, reintento_operativo] }
                  idempotency_key: { type: string }
                  cycle_number: { type: integer, minimum: 2 }
                  total_attempts: { type: integer, minimum: 0 }
                  cycle_attempts: { type: integer, minimum: 0, maximum: 8 }
                  started_at: { type: string, format: date-time }
                  reused: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Se requiere rol administrador. }
        '404': { description: Evento inexistente o no recuperable. }
        '409': { description: 'Evento entregado, cancelado, destinatario inactivo o clave incompatible.' }
        '422': { description: Motivo o clave idempotente inválidos. }
