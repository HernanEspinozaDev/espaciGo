      description: >-
        Modifica título, descripción, capacidad, reglas de uso y/o precio base de una publicación propia activa u oculta. Requiere titularidad y rol
        arrendador. Un cambio de precio agrega una nueva versión de tarifa y conserva cotizaciones/reservas
        anteriores. No cambia el estado ni agrega el espacio al catálogo general.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishedSpaceContentInput' }
      responses:
        '200':
          description: Datos vigentes de la publicación propia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/gallery:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listOwnSyntheticSpaceGallery
      tags: [M04 local]
      description: Lista únicamente las imágenes sintéticas activas del espacio propio. No las expone al catálogo general.
      responses:
        '200':
          description: Galería sintética propia y límite vigente.
          content:
            application/json:
              schema:
                type: object
                required: [items, max_photos, synthetic]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SyntheticSpaceGalleryPhoto' } }
                  max_photos: { type: integer, const: 10 }
                  synthetic: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSyntheticOwnSpaceGalleryPhoto
      tags: [M04 local]
      description: >-
        El Backend genera exclusivamente el PNG fijo synthetic-png-v1 y guarda el objeto fuera del repositorio y rutas públicas.
        No recibe bytes del cliente. Registra primero un candidato de limpieza durable; la inserción exitosa consume esa reserva en la misma transacción. Requiere rol arrendador, propiedad del espacio y clave de idempotencia; máximo 10 fotos activas.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      responses:
        '200': { description: Resultado reutilizado de un reintento idempotente., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticSpaceGalleryPhotoEnvelope' } } } }
        '201': { description: PNG sintético guardado., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticSpaceGalleryPhotoEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Storage privado temporalmente no disponible., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /spaces/{spaceId}/gallery/{photoId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnSyntheticSpaceGalleryPhoto
      tags: [M04 local]
      responses:
        '200': { description: Metadatos de una imagen activa propia., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticSpaceGalleryPhoto' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeOwnSyntheticSpaceGalleryPhoto
      tags: [M04 local]
      description: Retira la imagen propia y encola limpieza recuperable del archivo privado.
      responses:
        '200': { description: Resultado idempotente de la retirada., content: { application/json: { schema: { $ref: '#/components/schemas/SyntheticSpaceGalleryRemoval' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/gallery/{photoId}/content:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnSyntheticSpaceGalleryPhotoContent
      tags: [M04 local]
      description: Autoriza de nuevo al titular en cada consulta; responde PNG privado sin URL persistente.
      responses:
        '200': { description: Contenido PNG sintético., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Storage privado temporalmente no disponible., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /spaces/{spaceId}/availability:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: configureOwnDraftAvailability
      tags: [M04/M06 local]
      description: >-
        Configura una zona IANA explícita para el borrador propio. Para un espacio activo u oculto heredado,
        solo repara una zona ausente y solo si no tiene reservas; nunca reemplaza una zona existente ni
        asigna un valor automáticamente. La autorización se limita al titular autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityConfig' }
      responses:
        '200':
          description: Zona horaria configurada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: queryOwnDraftAvailability
      tags: [M04/M06 local]
      description: Comprueba intervalos finitos contra ocupaciones activas. El calendario `ocupacion` sigue siendo propiedad de M06.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
      responses:
        '200':
          description: Resultado de disponibilidad del espacio propio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/tariff:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnDraftTariff
      tags: [M05 local]
      description: Consulta la versión vigente de la tarifa base CLP del borrador propio.
      responses:
        '200': { description: Tarifa vigente, content: { application/json: { schema: { $ref: '#/components/schemas/Rate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOwnDraftTariff
      tags: [M05 local]
      description: Actualiza la tarifa del borrador propio creando una versión inmutable. No publica el borrador.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RateInput' } }
      responses:
        '200': { description: Nueva versión, content: { application/json: { schema: { $ref: '#/components/schemas/Rate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/tariffs:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listOwnDraftTariffVersions
      tags: [M05 local]
      description: Lista versiones inmutables de tarifa del borrador propio.
      responses:
        '200': { description: Historial de tarifas, content: { application/json: { schema: { $ref: '#/components/schemas/RateList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/price-simulations:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createPrivateOwnDraftPriceSimulation
      tags: [M05 local]
      description: 'Persiste una simulación privada del precio base si M06 confirma disponibilidad. Conserva snapshot de tarifa/versión/unidades/CLP/zona; no crea ocupación, retención, reserva, confirmación ni publicación. Horas transcurridas y fechas/meses calendario locales iniciados según aniversario local; ver decisión M05.'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PriceSimulationInput' } }
      responses:
        '201': { description: Simulación privada guardada, content: { application/json: { schema: { $ref: '#/components/schemas/PriceSimulation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/price-simulations/{simulationId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: simulationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnPrivatePriceSimulation
      tags: [M05 local]
      description: Consulta el snapshot privado del titular sin recalcularlo con la tarifa actual.
      responses:
        '200': { description: Snapshot de simulación, content: { application/json: { schema: { $ref: '#/components/schemas/PriceSimulation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /spaces/{spaceId}/availability/blocks:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOwnDraftManualBlocks
      tags: [M04/M06 local]
      description: Lista los bloqueos manuales activos propios que intersectan el rango consultado.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/UtcTimestamp' } }
      responses:
        '200':
          description: Calendario manual del borrador propio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualBlockList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    post:
      operationId: createOwnDraftManualBlock
      tags: [M04/M06 local]
      description: Crea un intervalo manual finito semiabierto `[inicio, término)` con motivo obligatorio. Un solape activo devuelve 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualBlockInput' }
      responses:
        '201':
          description: Bloqueo manual creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualBlock' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /spaces/{spaceId}/availability/timezone:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOwnDraftTimeZone
      tags: [M04/M06 local]
      description: Lee la zona horaria IANA configurada para un espacio propio en estado borrador, activo u oculto.
      responses:
        '200':
          description: Zona horaria del calendario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /spaces/{spaceId}/availability/blocks/{blockId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: blockId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteOwnDraftManualBlock
      tags: [M04/M06 local]
      description: Desactiva el bloqueo manual del borrador propio; conserva el registro de ocupación.
      responses:
        '204': { description: Bloqueo desactivado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/fixture:
    get:
      operationId: getAuthorizedLocalBookingFixture
      tags: [M06 local]
      description: >-
        Compatibilidad con M06-LOCAL-01: retorna el primer fixture autorizado
        para esa cuenta. Para seleccionar entre varios fixtures usa el catálogo
        y detalle; cotizar siempre requiere el space_id explícito. No es
        búsqueda pública ni permiso comercial.
      responses:
        '200': { description: Fixture privado con el banner de ensayo., content: { application/json: { schema: { $ref: '#/components/schemas/LocalBookingFixtureEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/catalog:
    get:
      operationId: searchAuthorizedLocalSyntheticCatalog
      tags: [M05 local]
      description: Lista fixtures de ensayo explícitamente habilitados para uno de sus dos participantes y publicaciones locales activas cuyo titular conserva elegibilidad KYC sintética efectiva. Los borradores no habilitados, espacios ocultos, ofertas sin KYC efectivo y espacios propios del actor no aparecen. No expone dirección, coordenadas ni propietario. Categoría, disponibilidad, atributos, precio y proximidad se combinan con AND. Cuando un intervalo filtra un espacio por hora con horario semanal activo, el intervalo debe caber por completo en un tramo y quedar libre de ocupaciones. Los filtros de atributos usan los tipos/unidades del perfil versionado indicado y solo aplican a espacios guardados con esa versión. Si se filtra por mínimo/máximo CLP inclusivo, se exige intervalo y se devuelve el total estimado de ese intervalo; la búsqueda no crea cotización ni ocupación. La proximidad requiere latitude, longitude y radius_km juntos; PostGIS aplica radio inclusivo y reporta distancia directa aproximada, no ruta. Con proximidad el orden es distancia sin redondear, total estimado cuando existe, luego UUID; con intervalo sin proximidad ordena total estimado y UUID; sin intervalo ni proximidad ordena categoría, título y UUID. Se filtran y ordenan todos los resultados antes de seleccionar la página. page_size predeterminado 5, rango 1–25. next_cursor es opaco, versionado y vinculado a cuenta, filtros y tamaño; enviarlo solo continúa la misma búsqueda. Sin next_cursor termina. Un cursor malformado, desconocido o reutilizado con otra cuenta/filtros/tamaño responde 422. La elegibilidad del titular y la autorización de fixtures se comprueban en cada solicitud. Los cursores del prototipo dependen de la instancia del Backend y pueden invalidarse al reiniciarla. Cada página consulta estado vigente; cambios de tarifa, disponibilidad o catálogo pueden cambiar la continuación. Reinicia la búsqueda para comenzar de nuevo. El paginado limita la respuesta, pero hoy se calcula y ordena el catálogo filtrado completo en el servicio, por lo que no optimiza toda la consulta.
      parameters:
        - { name: category_code, in: query, required: false, schema: { type: string, enum: [oficina, sala_multiproposito, bodega, estacionamiento, local_flexible, stand, quincho, parcela_eventos] } }
        - { name: start_at, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: end_at, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: min_total_clp, in: query, required: false, description: Mínimo inclusivo del total estimado CLP para el intervalo., schema: { type: integer, minimum: 0 } }
        - { name: max_total_clp, in: query, required: false, description: Máximo inclusivo del total estimado CLP para el intervalo., schema: { type: integer, minimum: 0 } }
        - { name: profile_version, in: query, required: false, description: Versión de perfil seleccionada; requerida junto con attributes y category_code., schema: { type: integer, minimum: 1 } }
        - { name: attributes, in: query, required: false, description: Objeto JSON URL-encoded de atributos tipados exactos; enum_list usa contención de elementos., schema: { type: string, maxLength: 16384, example: '{"proyector":false}' } }
        - { name: latitude, in: query, required: false, description: Centro sintético; requiere longitude y radius_km., schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: false, description: Centro sintético; requiere latitude y radius_km., schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: radius_km, in: query, required: false, description: Radio inclusivo permitido. Requiere latitude y longitude., schema: { type: integer, enum: [1, 3, 5, 10, 25] } }
        - { name: page_size, in: query, required: false, description: 'Cantidad de resultados, predeterminado 5.', schema: { type: integer, default: 5, minimum: 1, maximum: 25 } }
        - { name: cursor, in: query, required: false, description: 'Continuación opaca vinculada a cuenta, filtros, tamaño y orden de esta búsqueda.', schema: { type: string, minLength: 1, maxLength: 8192 } }
      responses:
        '200': { description: Resultados de catálogo local con banner de ensayo., content: { application/json: { schema: { $ref: '#/components/schemas/LocalCatalogEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/catalog/{spaceId}:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAuthorizedLocalSyntheticCatalogDetail
      tags: [M05 local]
      description: Devuelve el detalle seguro de un fixture habilitado para uno de sus participantes o de una publicación activa con KYC sintético efectivo del titular, incluyendo categoría, perfil/atributos, tarifa y zona del mismo espacio. Borradores no habilitados, ocultos, espacios propios y ofertas sin elegibilidad responden 404. Nunca incluye dirección, coordenadas, propietario ni galería privada.
      responses:
        '200': { description: Detalle del fixture con aviso local., content: { application/json: { schema: { $ref: '#/components/schemas/LocalCatalogDetailEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /local/booking-trial/catalog/{spaceId}/availability-options:
    get:
      operationId: getAuthorizedLocalFixtureAvailabilityOptions
      tags: [M06 local]
      description: 'Consulta candidatos para una fecha local de un fixture autorizado o publicación activa visible; requiere una sesión válida y la autorización correspondiente al espacio. La modalidad siempre procede de su tarifa vigente. El horizonte de inicio es hoy–hoy+90 días en la zona del espacio. Hora: duración transcurrida 1/2/4 h, inicios cada 30 min; día: 1/2/3 fechas calendario completas; mes: aniversario de un mes calendario con ajuste al último día. Excluye inicios pasados/iguales al reloj Backend, horas locales DST inexistentes, candidatos que no quepan por completo en un tramo semanal activo cuando aplica, y candidatos que solapen una ocupación activa; ambas instancias de una hora repetida se distinguen por sus intervalos UTC. Procesa vencimientos usando el mecanismo de M06. No persiste cotizaciones ni ocupaciones y no revela datos de otras reservas. La disponibilidad se revalida al cotizar y reservar.'
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, description: Fecha local única consultada en la zona IANA del espacio; no descarga el horizonte entero., schema: { type: string, format: date } }
        - { name: duration, in: query, required: true, description: 'Unidades compatibles con la modalidad vigente del espacio; hora 1/2/4 transcurridas, día 1/2/3 calendario, mes exactamente 1.', schema: { type: integer, enum: [1, 2, 3, 4] } }
      responses:
        '200': { description: 'Modalidad, zona IANA e intervalos UTC libres para la fecha elegida.', content: { application/json: { schema: { $ref: '#/components/schemas/LocalAvailabilityOptionsEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/catalog/{spaceId}/weekly-hours:
    parameters:
      - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnSyntheticHourlyWeeklyHours
      tags: [M06 local]
      description: Solo el anfitrión del fixture sintético por hora puede consultar la regla. Sin fila, activo es false y se conserva la disponibilidad previa. Con activo true, días sin tramos están cerrados. La respuesta incluye la zona IANA vigente.
      responses:
        '200': { description: Configuración semanal del espacio propio., content: { application/json: { schema: { $ref: '#/components/schemas/LocalWeeklyHoursEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceOwnSyntheticHourlyWeeklyHours
      tags: [M06 local]
      description: Solo el anfitrión. Hasta dos tramos por día, apertura < cierre, sin solapes ni cruce de medianoche. Cierre 24:00 es límite exclusivo final del día; apertura 00:00 es válida. Horas inexistentes no producen intervalos; durante horas repetidas solo se ofrece un intervalo si todas sus porciones reales permanecen dentro de un tramo. La escritura se serializa con cotizaciones y solicitudes. No altera ocupaciones, reservas ni historial. Día/mes no son elegibles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, days]
              properties:
                enabled: { type: boolean }
                days: { type: array, minItems: 7, maxItems: 7, items: { $ref: '#/components/schemas/LocalWeeklyDay' } }
      responses:
        '200': { description: Configuración semanal persistida., content: { application/json: { schema: { $ref: '#/components/schemas/LocalWeeklyHoursEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /local/booking-trial/quotes:
    post:
      operationId: quoteAuthorizedLocalBooking
      tags: [M06 local]
      description: Cotiza sin ocupar un fixture habilitado o una publicación activa visible; conserva snapshot de tarifa, zona, condiciones, categoría y perfil. Al solicitar una reserva, el Backend exige elegibilidad KYC local vigente para anfitrión y arrendatario. Para espacios por hora con horario semanal activo, el intervalo completo debe caber en un tramo y estar libre de ocupaciones. La validación se serializa con cambios de horario. Caducidad provisional configurable de 15 minutos; reservar vuelve a validar publicación, tarifa, elegibilidad, horario y disponibilidad dentro de la transacción.
