openapi: 3.1.0
info:
  title: EspaciGo API
  version: 1.0.0
  description: 'Prototipo local sintético. Reseñas y avisos M09 usan la decisión D-COMM local; no son servicios productivos ni plazos legales.'
servers:
- url: /api/v1
  description: Base relativa versionada; el host se configura por entorno.
security:
- bearerAuth: []
paths:
  /admin/global/me:
    get:
      operationId: getGlobalAdminMe
      tags: [Global administration]
      summary: Confirmar capacidades vigentes del administrador global
      responses:
        '200': {description: Sesión global confirmada, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalAdminMeEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/global/overview:
    get:
      operationId: getGlobalAdminOverview
      tags: [Global administration]
      summary: Obtener conteos reales de cuentas para administración global
      responses:
        '200': {description: Agregados actuales; activo no equivale a DAU, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalAdminOverviewEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/global/kpis:
    get:
      operationId: getGlobalAdminKPIs
      tags: [Global administration]
      summary: Obtener indicadores operativos persistidos por período
      description: Requiere kpi.read. Zona IANA requerida; intervalo de máximo 31 días. Incluye fuente/definición, instantánea generada y montos CLP como texto exacto. Los estados vigentes no reconstruyen historia ni son DAU; finanzas sintéticas excluyen garantías.
      parameters:
      - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: until, required: true, description: Exclusivo, schema: {type: string, format: date-time}}
      - {in: query, name: time_zone, required: true, schema: {type: string, maxLength: 80}}
      responses:
        '200': {description: Indicadores persistidos y auditados, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/global/audit-events:
    get:
      operationId: listGlobalAdminAuditEvents
      tags: [Global administration]
      summary: Consultar auditoría minimizada con filtros actor/objetivo separados
      description: Requiere audit.read. Ventana fija de máximo 31 días; cursor keyset fijado al corte temporal y a filtros/tamaño normalizados. Eventos históricos no se reidentifican; los objetivos sin campo explícito permanecen nulos.
      parameters:
      - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: until, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: actor_id, schema: {type: string, format: uuid}}
      - {in: query, name: target_account_id, schema: {type: string, format: uuid}}
      - {in: query, name: resource_type, schema: {type: string, maxLength: 40}}
      - {in: query, name: resource_id, schema: {type: string, format: uuid}}
      - {in: query, name: action, schema: {type: string, maxLength: 60}}
      - {in: query, name: result, schema: {type: string, enum: [exito, rechazo]}}
      - {in: query, name: reason_code, schema: {type: string, maxLength: 80}}
      - {in: query, name: correlation_id, schema: {type: string, format: uuid}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      - {in: query, name: cursor, schema: {type: string, maxLength: 2048}}
      - {in: query, name: snapshot_cutoff, description: Corte registrado devuelto por la primera página; debe coincidir con el corte codificado en el cursor., schema: {type: string, format: date-time}}
      responses:
        '200': {description: Página auditada, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/global/audit-events/export:
    get:
      operationId: exportGlobalAdminAuditEvents
      tags: [Global administration]
      summary: Exportar auditoría global minimizada en JSON o CSV
      description: Requiere audit.export. Filtros y ventana son idénticos a la consulta; máximo 10.000 filas y 31 días; falla sin archivo parcial. El instante de corte precede la auditoría de exportación. CSV protege fórmulas y respeta quoting estándar.
      parameters:
      - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: until, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: actor_id, schema: {type: string, format: uuid}}
      - {in: query, name: target_account_id, schema: {type: string, format: uuid}}
      - {in: query, name: resource_type, schema: {type: string, maxLength: 40}}
      - {in: query, name: resource_id, schema: {type: string, format: uuid}}
      - {in: query, name: action, schema: {type: string, maxLength: 60}}
      - {in: query, name: result, schema: {type: string, enum: [exito, rechazo]}}
      - {in: query, name: reason_code, schema: {type: string, maxLength: 80}}
      - {in: query, name: correlation_id, schema: {type: string, format: uuid}}
      - {in: query, name: snapshot_cutoff, required: true, description: Corte obtenido con la página consultada; la generación del archivo queda reportada por separado., schema: {type: string, format: date-time}}
      - {in: query, name: format, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        '200':
          description: Archivo exportado sin cache
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            application/json: {schema: {type: object}}
            text/csv: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Filtros inválidos o exceso de filas}
  /admin/global/accounts:
    get:
      operationId: listGlobalAdminAccounts
      tags: [Global administration]
      summary: Listar cuentas con filtros allowlisted y cursor keyset
      parameters:
      - {in: query, name: account_id, schema: {type: string, format: uuid}}
      - {in: query, name: email_prefix, schema: {type: string, maxLength: 120}}
      - {in: query, name: name_prefix, schema: {type: string, maxLength: 120}}
      - {in: query, name: role, schema: {type: string, enum: [arrendatario, arrendador, administrador, administrador_global]}}
      - {in: query, name: state, schema: {type: string, enum: [correo_pendiente, activo, bloqueado, baja_solicitada, desidentificado]}}
      - {in: query, name: administrative_blocked, schema: {type: boolean}}
      - {in: query, name: created_from, description: RFC3339 inclusivo UTC, schema: {type: string, format: date-time}}
      - {in: query, name: created_until, description: RFC3339 exclusivo UTC, schema: {type: string, format: date-time}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
      - {in: query, name: cursor, schema: {type: string, maxLength: 2048}}
      responses:
        '200': {description: Página mínima y conteo, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalAdminAccountPageEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/global/accounts/{accountID}:
    get:
      operationId: getGlobalAdminAccount
      tags: [Global administration]
      summary: Consultar proyección mínima de una cuenta
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Cuenta y conteos de recursos, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalAdminAccountEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/global/accounts/{accountID}/profile:
    patch:
      operationId: updateGlobalAdminAccountProfile
      tags: [Global administration]
      summary: Actualizar campos allowlisted del perfil con versión esperada
      description: El correo verificado no se cambia aquí. Requiere sesión creada en los últimos 10 minutos y motivo permitido.
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [display_name, expected_updated_at, reason], properties: {display_name: {type: string, minLength: 1, maxLength: 120}, phone: {type: [string, 'null'], pattern: '^[0-9]{9}$'}, expected_updated_at: {type: string, format: date-time}, reason: {type: string, enum: [correccion_perfil, revision_administrativa, gestion_operativa]}}}
      responses:
        '200': {description: Perfil actualizado y auditado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/accounts/{accountID}/roles/{role}:
    put:
      operationId: setGlobalAdminMarketplaceRole
      tags: [Global administration]
      summary: Establecer de forma idempotente un rol ordinario de marketplace
      description: Solo admite arrendatario o arrendador; nunca concede administrador ni administrador global.
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: role, required: true, schema: {type: string, enum: [arrendatario, arrendador]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [granted, reason], properties: {granted: {type: boolean}, reason: {type: string, enum: [correccion_perfil, revision_administrativa, gestion_operativa]}}}
      responses:
        '200': {description: Estado deseado aplicado o ya vigente; evento auditado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/accounts/{accountID}/legacy-administrator:
    put:
      operationId: setGlobalAdminLegacyAdministratorRole
      tags: [Global administration]
      summary: Establecer de forma idempotente el rol legado de administrador
      description: Requiere capacidad admin_access.manage y sesión reciente. Concede solo el rol administrador legado; nunca altera ni concede la membresía administrador_global. Cada transición, incluida una repetición idempotente, queda auditada.
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [granted, reason], properties: {granted: {type: boolean}, reason: {type: string, enum: [aprovisionamiento_sintetico, revision_administrativa, retirada_acceso]}}}
      responses:
        '200': {description: Estado deseado aplicado o ya vigente; evento auditado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/accounts/{accountID}/sessions/revoke:
    post:
      operationId: revokeGlobalAdminAccountSessions
      tags: [Global administration]
      summary: Revocar todas las sesiones activas de otra cuenta
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, enum: [correccion_perfil, revision_administrativa, gestion_operativa]}}}
      responses:
        '200': {description: Sesiones revocadas y acción auditada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/accounts/{accountID}/block:
    post:
      operationId: setGlobalAdminAccountBlocked
      tags: [Global administration]
      summary: Bloquear o desbloquear una cuenta con revocación de sesiones
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [blocked, reason], properties: {blocked: {type: boolean}, reason: {type: string, enum: [riesgo_seguridad, uso_indebido, revision_administrativa, revision_concluida, error_bloqueo, riesgo_resuelto]}}}
      responses:
        '200': {description: Estado cambiado; historial y auditoría atómicos}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/accounts/{accountID}/resources/{resourceKind}:
    get:
      operationId: listGlobalAdminAccountResources
      tags: [Global administration]
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: resourceKind, required: true, schema: {type: string, enum: [reservations, incidents]}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
      - {in: query, name: cursor, schema: {type: string, maxLength: 2048}}
      responses: {'200': {description: Recursos vinculados a la cuenta, minimizados y paginados}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /admin/global/accounts/{accountID}/resources/{resourceKind}/{resourceID}:
    get:
      operationId: getGlobalAdminAccountResource
      tags: [Global administration]
      parameters:
      - {in: path, name: accountID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: resourceKind, required: true, schema: {type: string, enum: [reservations, incidents]}}
      - {in: path, name: resourceID, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Recurso autorizado con datos mínimos necesarios}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /admin/global/publications:
    get:
      operationId: listGlobalAdminPublications
      tags: [Global administration]
      summary: Consultar todas las publicaciones con propietario y visibilidad pública efectiva
      parameters:
      - {in: query, name: owner_id, schema: {type: string, format: uuid}}
      - {in: query, name: category, schema: {type: string, maxLength: 80}}
      - {in: query, name: state, schema: {type: string, enum: [borrador, activa, oculta, eliminada]}}
      - {in: query, name: search, schema: {type: string, maxLength: 120}}
      - {in: query, name: publicly_visible, schema: {type: boolean}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
      - {in: query, name: cursor, schema: {type: string, maxLength: 2048}}
      responses:
        '200': {description: Inventario paginado; visible distingue el estado activa de la política pública vigente, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalAdminPublicationPageEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/global/publications/{publicationID}/state:
    post:
      operationId: changeGlobalAdminPublicationState
      tags: [Global administration]
      summary: Publicar u ocultar mediante las reglas vigentes de catálogo y KYC
      description: No cambia propietario ni ocupaciones. No retira físicamente publicaciones y conserva el historial append-only.
      parameters:
      - {in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [state, expected_updated_at, reason], properties: {state: {type: string, enum: [activa, oculta]}, expected_updated_at: {type: string, format: date-time}, reason: {type: string, enum: [correccion_perfil, revision_administrativa, gestion_operativa]}}}
      responses:
        '200': {description: Estado cambiado con reglas de publicación e historial transaccional}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/publications/{publicationID}/content:
    patch:
      operationId: updateGlobalAdminPublicationContent
      tags: [Global administration]
      summary: Corregir campos allowlisted, tarifa versionada o portada publicada
      description: Solo borradores, publicaciones activas u ocultas. Valida contenido del dominio y versión esperada; mantiene propietario y snapshots de reservas.
      parameters:
      - {in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expected_updated_at, reason], properties: {title: {type: string, maxLength: 70}, description: {type: string, minLength: 100}, capacity: {type: integer, minimum: 1}, usage_rules: {type: string, maxLength: 250}, base_price_clp: {type: string, pattern: '^[0-9]+$'}, region_code: {type: string, pattern: '^[0-9]{2}$'}, comuna_code: {type: string, pattern: '^[0-9]{5}$'}, cover_photo_id: {type: string, format: uuid}, attribute_schema_version: {type: integer, minimum: 1}, attributes: {type: object, additionalProperties: true}, expected_updated_at: {type: string, format: date-time}, reason: {type: string, enum: [correccion_perfil, revision_administrativa, gestion_operativa]}}}
      responses:
        '200': {description: Campos allowlisted actualizados y auditados}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/publications/{publicationID}/retire:
    post:
      operationId: retireGlobalAdminPublication
      tags: [Global administration]
      summary: Retirar publicación con retención y obligación controladas
      parameters: [{in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [owner_id, expected_updated_at, reason], properties: {owner_id: {type: string, format: uuid}, expected_updated_at: {type: string, format: date-time}, reason: {type: string, enum: [moderacion_contenido, riesgo_seguridad, solicitud_titular, revision_administrativa]}}}
      responses:
        '200': {description: Retiro append-only con actor administrativo y limpieza durable}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {description: Se requiere sesión reciente}
  /admin/global/publications/{publicationID}/schedule:
    get:
      operationId: getGlobalAdminPublicationSchedule
      tags: [Global administration]
      summary: Consultar el horario semanal de una publicación por hora
      description: Requiere permiso administrativo de lectura y owner_id. La lectura genera auditoría y no revela horarios de otros propietarios a usuarios normales.
      parameters: [{in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}, {in: query, name: owner_id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Horario semanal vigente}, '403': {$ref: '#/components/responses/Forbidden'}}
    put:
      operationId: updateGlobalAdminPublicationSchedule
      tags: [Global administration]
      summary: Guardar el horario semanal mediante revisión administrativa
      description: Solo publicaciones no eliminadas con tarifa por hora. Exige sesión reciente, owner_id, versión actual y motivo permitido. No crea cotizaciones, reservas ni fixture de participantes.
      parameters: [{in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [owner_id, enabled, days, expected_updated_at, reason], properties: {owner_id: {type: string, format: uuid}, enabled: {type: boolean}, days: {type: array}, expected_updated_at: {type: string, format: date-time}, reason: {type: string, enum: [correccion_perfil, revision_administrativa, gestion_operativa]}}}
      responses: {'200': {description: Horario semanal y auditoría guardados transaccionalmente}, '409': {$ref: '#/components/responses/Conflict'}, '428': {description: Se requiere sesión reciente}}
  /admin/global/publications/{publicationID}/gallery:
    get:
      operationId: listGlobalAdminPublicationGallery
      tags: [Global administration]
      parameters: [{in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}, {in: query, name: owner_id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Metadatos minimizados de galería con portada y limpieza pendiente}}
  /admin/global/publications/{publicationID}/gallery/{photoID}/visibility:
    patch:
      operationId: setGlobalAdminPublicationPhotoVisibility
      tags: [Global administration]
      parameters: [{in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}, {in: path, name: photoID, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [owner_id, enabled, expected_updated_at, reason], properties: {owner_id: {type: string, format: uuid}, enabled: {type: boolean}, expected_updated_at: {type: string, format: date-time}, reason: {type: string}}}
      responses: {'200': {description: Visibilidad de foto actualizada y auditada}, '409': {$ref: '#/components/responses/Conflict'}, '428': {description: Se requiere sesión reciente}}
  /admin/global/publications/{publicationID}/gallery/{photoID}/cover:
    post:
      operationId: selectGlobalAdminPublicationCover
      tags: [Global administration]
      parameters: [{in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}, {in: path, name: photoID, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [owner_id, expected_updated_at, reason], properties: {owner_id: {type: string, format: uuid}, expected_updated_at: {type: string, format: date-time}, reason: {type: string}}}
      responses: {'200': {description: Portada seleccionada}, '409': {$ref: '#/components/responses/Conflict'}, '428': {description: Se requiere sesión reciente}}
  /admin/global/publications/{publicationID}/gallery/{photoID}/remove:
    post:
      operationId: removeGlobalAdminPublicationPhoto
      tags: [Global administration]
      parameters: [{in: path, name: publicationID, required: true, schema: {type: string, format: uuid}}, {in: path, name: photoID, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [owner_id, expected_updated_at, reason], properties: {owner_id: {type: string, format: uuid}, expected_updated_at: {type: string, format: date-time}, reason: {type: string}}}
      responses: {'200': {description: Foto retirada con limpieza durable}, '409': {$ref: '#/components/responses/Conflict'}, '428': {description: Se requiere sesión reciente}}
  /public/spaces:
    get:
      operationId: listPublicSpaces
      security: []
      tags: [Public catalog]
      summary: Explorar publicaciones públicas elegibles
      parameters:
      - {in: query, name: q, description: Texto NFC; máximo 120 caracteres. Stopwords o puntuación sin lexemas dan una página vacía., schema: {type: string, maxLength: 120}}
      - {in: query, name: category_code, schema: {type: string, maxLength: 80}}
      - {in: query, name: region_code, schema: {type: string, pattern: '^[0-9]{2}$'}}
      - {in: query, name: comuna_code, schema: {type: string, pattern: '^[0-9]{5}$'}}
      - {in: query, name: min_area_m2, description: Superficie positiva en m², hasta dos decimales., schema: {type: number, exclusiveMinimum: 0}}
      - {in: query, name: attribute, description: "Repetible hasta 32 veces y requiere category_code. Booleanos conservan `codigo:true|false`; integer/number usan `codigo:gte:valor` y/o `codigo:lte:valor`; enum usa `codigo:eq:opcion`; enum_list usa `codigo:in:opcion1,opcion2` (OR dentro del atributo). Códigos, operadores, opciones, límites y versión se validan contra la allowlist pública y el perfil; duplicados ambiguos dan 422.", style: form, explode: true, schema: {type: array, maxItems: 32, items: {type: string, maxLength: 180, pattern: '^[a-z][a-z0-9_]{0,59}:(true|false|gte:(0|[1-9][0-9]*)(\.[0-9]+)?|lte:(0|[1-9][0-9]*)(\.[0-9]+)?|eq:[a-z][a-z0-9_]{0,79}|in:[a-z][a-z0-9_]{0,79}(,[a-z][a-z0-9_]{0,79})*)$'}}}
      - {in: query, name: rate_unit, schema: {type: string, enum: [hora, dia, mes]}}
      - {in: query, name: min_unit_price_clp, schema: {type: integer, format: int64, minimum: 0}}
      - {in: query, name: max_unit_price_clp, schema: {type: integer, format: int64, minimum: 0}}
      - {in: query, name: start_at, description: RFC3339 con offset. Ambos extremos habilitan estimación con la tarifa y zona horaria vigentes., schema: {type: string, format: date-time}}
      - {in: query, name: end_at, schema: {type: string, format: date-time}}
      - {in: query, name: min_total_clp, schema: {type: integer, format: int64, minimum: 0}}
      - {in: query, name: max_total_clp, schema: {type: integer, format: int64, minimum: 0}}
      - {in: query, name: sort, description: "default ordena por categoría y título; title_asc/title_desc comparan título normalizado con space_id estable. Las tarifas requieren rate_unit explícito, relevance requiere q y total estimado requiere inicio/fin.", schema: {type: string, enum: [default, title_asc, title_desc, unit_price_asc, unit_price_desc, relevance, estimated_total_asc, estimated_total_desc], default: default}}
      - {in: query, name: page_size, description: 'Tamaño de página limitado por cursor keyset. Conserva valores históricos 1–25 y admite hasta 48.', schema: {type: integer, minimum: 1, maximum: 48, default: 20}}
      - {in: query, name: cursor, schema: {type: string, maxLength: 4096}}
      responses:
        '200': {description: Página pública minimizada, content: {application/json: {schema: {$ref: '#/components/schemas/PublicSpacePage'}}}}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
