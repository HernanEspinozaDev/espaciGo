      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [kind, outcome], properties: { kind: { type: string, enum: [autorizacion, captura, liberacion] }, outcome: { type: string, enum: [exito, rechazo], description: Rechazo solo se admite para autorización. } } }
