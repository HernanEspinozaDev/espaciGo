services:
  angular-frontend:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-angular:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      API_PUBLIC_BASE_URL: http://127.0.0.1:${LOCAL_API_PORT:-8080}/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_ANGULAR_PORT:-4200}:4000"
    networks:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  angular-runner:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-angular-runner:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runner
    profiles: [verify]
    environment:
      FRONTEND_INTERNAL_URL: http://angular-frontend:4000
      API_INTERNAL_BASE_URL: http://backend:8080/api/v1
      API_PUBLIC_BASE_URL: http://127.0.0.1:${LOCAL_API_PORT:-8080}/api/v1
      FRONTEND_PUBLIC_ORIGIN: http://127.0.0.1:${LOCAL_ANGULAR_PORT:-4200}
    depends_on:
      angular-frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - api

  angular-e2e:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-angular-e2e:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    profiles: [e2e]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      FRONTEND_BASE_URL: http://angular-frontend:4000
      FE14_ACCOUNT_FILE: /run/fe14/accounts.json
      FE14_ARTIFACT_DIR: /run/fe14/artifacts
    volumes:
      - ${LOCAL_DOCKER_STATE_DIR:-/tmp/espacigo-fe14-not-configured}:/run/fe14
    depends_on:
      angular-frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - api
