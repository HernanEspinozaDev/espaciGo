services:
  angular-frontend:
    image: ${LOCAL_IMAGE_PREFIX:-espacigo-local}-angular:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      API_PUBLIC_BASE_URL: http://localhost:${LOCAL_API_PORT:-8080}/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_ANGULAR_PORT:-4200}:4000"
    networks:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
